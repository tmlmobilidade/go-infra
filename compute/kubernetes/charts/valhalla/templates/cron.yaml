{{- if .Values.updateCron.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.name }}-updater
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.name }}-updater
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.name }}-updater
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.name }}-updater
subjects:
  - kind: ServiceAccount
    name: {{ .Values.name }}-updater
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.name }}-update
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.updateCron.schedule | quote }}
  timeZone: {{ .Values.updateCron.timeZone | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: {{ .Values.name }}-updater
          restartPolicy: Never
          containers:
            - name: updater
              image: {{ .Values.updateCron.image | quote }}
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  CUSTOM_DIR="{{ .Values.updateCron.mountPath }}"
                  PBF="{{ .Values.updateCron.pbfFileName }}"
                  URL="{{ .Values.pbfUrl }}"
                  NS="{{ .Release.Namespace }}"
                  DEPLOY="{{ .Values.updateCron.deploymentName }}"

                  mkdir -p "$CUSTOM_DIR/backups"
                  curl -fsSL -o "$CUSTOM_DIR/$PBF.new" "$URL"
                  [ -s "$CUSTOM_DIR/$PBF.new" ]

                  if [ -f "$CUSTOM_DIR/$PBF" ]; then
                    cp "$CUSTOM_DIR/$PBF" "$CUSTOM_DIR/backups/$PBF.$(date +%Y%m%d-%H%M%S)"
                  fi

                  mv "$CUSTOM_DIR/$PBF.new" "$CUSTOM_DIR/$PBF"
                  rm -rf "$CUSTOM_DIR/valhalla_tiles" "$CUSTOM_DIR/valhalla_tiles.tar"

                  kubectl rollout restart "deployment/$DEPLOY" -n "$NS"
                  kubectl rollout status "deployment/$DEPLOY" -n "$NS" --timeout=30m
              volumeMounts:
                - name: data
                  mountPath: {{ .Values.updateCron.mountPath }}
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: {{ .Values.updateCron.pvcClaimName }}
{{- end }}
