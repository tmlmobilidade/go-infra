# go-docs — pod + Ingress for Exact `/` (and docs static assets) on apex + PR hosts.
apiVersion: v1
kind: Namespace
metadata:
  name: stg-docs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stg-docs
  namespace: stg-docs
  labels:
    app: stg-docs
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/match-tag: "true"
    keel.sh/pollSchedule: "@every 30s"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stg-docs
  template:
    metadata:
      labels:
        app: stg-docs
    spec:
      containers:
        - name: stg-docs
          image: ghcr.io/tmlmobilidade/go-docs:production
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: stg-docs
  namespace: stg-docs
  labels:
    app: stg-docs
spec:
  selector:
    app: stg-docs
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stg-docs
  namespace: stg-docs
  labels:
    app: stg-docs
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - go-stg.tmlmobilidade.pt
        - "*.go-stg.tmlmobilidade.pt"
  rules:
    - host: go-stg.tmlmobilidade.pt
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stg-docs
                port:
                  number: 80
    - host: "*.go-stg.tmlmobilidade.pt"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stg-docs
                port:
                  number: 80
