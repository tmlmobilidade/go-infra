<!DOCTYPE html>
<html lang="pt">
<head>
	<meta charset="UTF-8">
	<title>GO | 404 Not Found</title>
	<meta http-equiv="refresh" content="5;url=https://go-stg.tmlmobilidade.pt">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Jersey+25&display=swap" rel="stylesheet">
</head>

<body>

	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
			color: white;
			text-decoration: none;
			letter-spacing: 0.5px;
			font-family: "Work Sans", sans-serif;
		}
		body {
			font-style: normal;
			line-height: 1.8;
			background-color: rgb(45, 15, 115);
		}
		.container {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 30px;
			text-align: center;
			height: 100vh;
			width: 100%;
			max-width: 500px;
			margin: auto;
		}
		.title {
			font-family: "Jersey 25", sans-serif;
			font-weight: 400;
			font-size: 70px;
			line-height: 1;
			letter-spacing: 0;
			text-transform: uppercase;
			opacity: 0.5;
		}
		.text {
			font-weight: 500;
			font-size: 18px;
		}
		.retry {
			font-weight: 600;
			font-size: 20px;
			opacity: 0;
			transition: opacity 0.3s ease;
		}
	</style>

	<div class="container">
		<h1 class="title">404</h1>
		<p class="text">O recurso que procura não está disponível nesta página.</p>
		<p id="retry" class="retry">A redirecionar...</p>
	</div>

	<script>
		document.getElementById("retry").style.opacity = 1;
		setTimeout(() => {
			window.location.href = "https://go-stg.tmlmobilidade.pt";
		}, 5_000);
	</script>

</body>
</html>
