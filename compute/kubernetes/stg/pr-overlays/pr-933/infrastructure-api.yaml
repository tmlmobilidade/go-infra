apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pr-933-infrastructure-api
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: pr-933-infrastructure
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/stg/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: pr-933
    module: infrastructure
    app: api
    replicas: 1
    service:
      targetPort: 5050
    resources:
      memory: 1Gi
    ingress:
      enabled: true
      # Do not match /infrastructure/api — Prefix /infrastructure steals API POSTs → Next.js 405 text/html.
      path: "/infrastructure(?:$|/(?!api(?:/|$)).*)"
      pathType: ImplementationSpecific
      annotations:
        nginx.ingress.kubernetes.io/use-regex: "true"
      host: pr-933.go-stg.tmlmobilidade.pt
    secrets:
      - stg-module-infrastructure
      - stg-platform-locationsdb
      - stg-platform-godb
      - stg-platform-storage
    probes:
      startup:
        enabled: true
    logging:
      enabled: true
      cluster: go-stg
      loki:
        secretName: stg-platform-loki
    env: []
  suspend: false
