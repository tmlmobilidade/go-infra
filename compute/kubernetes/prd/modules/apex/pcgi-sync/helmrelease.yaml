apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: apex-pcgi-sync
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: prd-apex
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: prd
    module: apex
    app: pcgi-sync
    replicas: 1
    resources:
      memory: 4Gi
    service:
      targetPort: 5050
    ingress:
      enabled: false
    secrets:
      - prd-module-apex
      - prd-platform-rawdb
      - prd-platform-pcgi-tunnel
      - prd-platform-pcgi-file-manager
      - prd-platform-sentry
    env: []