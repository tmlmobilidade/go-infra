# One Master for go.tmlmobilidade.pt. Path Ingresses (go-app) are Minions.
# server_name ~^.*$ also accepts the NLB IP (and any Host) on this same vhost.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: host-prd
  namespace: ingress-nginx
  annotations:
    nginx.org/mergeable-ingress-type: "master"
    nginx.org/ssl-redirect: "true"
    nginx.org/server-snippets: |
      server_name go.tmlmobilidade.pt ~^.*$;
spec:
  ingressClassName: nginx
  tls:
    - hosts: [go.tmlmobilidade.pt]
  rules:
    - host: go.tmlmobilidade.pt
