apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pr-513-exporter-export-files
  namespace: flux-system
spec:
  interval: 5m
  dependsOn:
    - name: onepassword-connect
  targetNamespace: pr-513-exporter
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    module: exporter
    replicas: 1
    service:
      targetPort: 5050
    ingress:
      enabled: false
      host: pr-513.go-stg.tmlmobilidade.pt
    secrets:
      - stg-platform-storage
    env: []
    environment: pr-513
    app: export-files
