apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pr-573-plans-organizer
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: pr-573-plans
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: pr-573
    module: plans
    app: organizer
    replicas: 1
    service:
      targetPort: 5050
    ingress:
      enabled: true
      host: pr-573.go-stg.tmlmobilidade.pt
    secrets:
      - stg-module-plans
      - stg-platform-godb
      - stg-platform-storage
    env: []
  suspend: false
