apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pr-704-hub-docs
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: pr-704-hub
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/stg/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: pr-704
    module: hub
    app: docs
    image: ghcr.io/tmlmobilidade/go-docs:production
    replicas: 1
    resources:
      memory: 2Gi
      cpu: 1
    service:
      targetPort: 3000
    ingress:
      enabled: true
      path: /hub/reference(/|$)(.*)
      pathType: ImplementationSpecific
      annotations:
        nginx.ingress.kubernetes.io/use-regex: "true"
        nginx.ingress.kubernetes.io/rewrite-target: /reference$1$2
    logging:
      enabled: true
      appArgs:
        - server.js
      cluster: go-stg
      loki:
        secretName: stg-platform-loki
    env:
      - name: PORT
        value: "3000"
  suspend: false