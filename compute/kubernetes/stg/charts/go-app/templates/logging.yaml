{{- if .Values.logging.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "{{ .Values.environment }}-{{ .Values.module }}-{{ .Values.app }}"
  namespace: "{{ .Values.environment }}-{{ .Values.module }}"
  labels:
    environment: {{ .Values.environment }}
    module: {{ .Values.module }}
    app: {{ .Values.app }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "{{ .Values.environment }}-{{ .Values.module }}-{{ .Values.app }}-logs"
  namespace: "{{ .Values.environment }}-{{ .Values.module }}"
  labels:
    environment: {{ .Values.environment }}
    module: {{ .Values.module }}
    app: {{ .Values.app }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "{{ .Values.environment }}-{{ .Values.module }}-{{ .Values.app }}-logs"
  namespace: "{{ .Values.environment }}-{{ .Values.module }}"
  labels:
    environment: {{ .Values.environment }}
    module: {{ .Values.module }}
    app: {{ .Values.app }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: "{{ .Values.environment }}-{{ .Values.module }}-{{ .Values.app }}-logs"
subjects:
  - kind: ServiceAccount
    name: "{{ .Values.environment }}-{{ .Values.module }}-{{ .Values.app }}"
    namespace: "{{ .Values.environment }}-{{ .Values.module }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Values.environment }}-{{ .Values.module }}-{{ .Values.app }}-logging"
  namespace: "{{ .Values.environment }}-{{ .Values.module }}"
  labels:
    environment: {{ .Values.environment }}
    module: {{ .Values.module }}
    app: {{ .Values.app }}
data:
  config.alloy: |
    logging {
      level  = "warn"
      format = "logfmt"
    }

    discovery.kubernetes "local" {
      role = "pod"
      namespaces {
        names = [env("POD_NAMESPACE")]
      }
      selectors {
        role  = "pod"
        field = "metadata.name=" + env("POD_NAME")
      }
    }

    discovery.relabel "local" {
      targets = discovery.kubernetes.local.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        regex         = "log-shipper"
        action        = "drop"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "service_name"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
    }

    loki.source.kubernetes "local" {
      targets    = discovery.relabel.local.output
      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = {{ .Values.logging.loki.url | quote }}
        basic_auth {
          username = env("LOKI_USERNAME")
          password = env("LOKI_PASSWORD")
        }
      }
      external_labels = {
        cluster     = {{ .Values.logging.cluster | quote }},
        environment = {{ .Values.environment | quote }},
        module      = {{ .Values.module | quote }},
        app         = {{ .Values.app | quote }},
      }
    }
{{- end }}
