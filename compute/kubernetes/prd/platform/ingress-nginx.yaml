apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ingress-nginx-charts
  namespace: flux-system
spec:
  interval: 1h
  url: https://kubernetes.github.io/ingress-nginx
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: ingress-nginx
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: ingress-nginx
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx-charts
        namespace: flux-system
      interval: 1h
  values:
    controller:
      replicaCount: 4
      # Every ingress for the cluster flows through this controller.
      # Requests match limits (OKE Virtual Nodes).
      resources:
        requests:
          cpu: "2000m"
          memory: "2Gi"
        limits:
          cpu: "2000m"
          memory: "2Gi"
      # Public OCI Network Load Balancer (internet-facing), same pattern as STG.
      # Virtual Nodes: Pods as Backends (targetPort 80/443), not NodePort.
      service:
        type: LoadBalancer
        allocateLoadBalancerNodePorts: false
        externalTrafficPolicy: Cluster
        annotations:
          oci.oraclecloud.com/load-balancer-type: "nlb"
          oci-network-load-balancer.oraclecloud.com/internal: "false"
          oci-network-load-balancer.oraclecloud.com/assigned-private-ipv4: "10.81.101.2"
          oci-network-load-balancer.oraclecloud.com/subnet: "ocid1.subnet.oc1.eu-frankfurt-1.aaaaaaaap4iuqtem64qsbejvu73u7ssm5n3eaa7ggds76zsokytka24q5pna"
          oci-network-load-balancer.oraclecloud.com/health-check: '{"protocol":"TCP","retries":3,"timeoutInMillis":3000,"intervalInMillis":10000}'
      extraArgs:
        default-ssl-certificate: "ingress-nginx/go-prd-tls"
      allowSnippetAnnotations: true
      annotationRiskLevel: Critical
      watchIngressWithoutClass: false
      ingressClassResource:
        name: nginx
        enabled: true
        default: true
      config:
        server-tokens: "false"
        use-forwarded-headers: "true"
        compute-full-forwarded-for: "true"
        use-http2: "true"
        ssl-redirect: "true"
        proxy-body-size: "1g"
        proxy-connect-timeout: "10"
        proxy-send-timeout: "20"
        proxy-read-timeout: "20"
        client-body-timeout: "300"
        keep-alive: "65"
        upstream-keepalive-connections: "16"
        upstream-keepalive-timeout: "10"
        use-gzip: "true"
        gzip-types: "application/json"
        proxy-buffering: "on"
        custom-http-errors: "404,500,501,502,503,504"
        http-snippet: |
          # Rate limits (gateway-style). Zones are per controller pod.
          limit_req_zone global zone=global:10m rate=1000r/s;
          limit_req_zone $binary_remote_addr zone=ip:10m rate=1000r/s;
          # Cache zone (gateway-style): only used when upstream sends Cache-Control/Expires.
          proxy_cache_path /tmp/nginx-cache
            levels=1:2
            keys_zone=go_cache:10m
            max_size=1g
            inactive=1h
            use_temp_path=off;
          upstream docs_upstream {
            least_conn;
            server prd-docs.prd-docs.svc.cluster.local:80 max_fails=3 fail_timeout=5s;
            keepalive 10;
          }
        # limit_req must be in location-snippet — server-snippet does not apply to Ingress locations.
        location-snippet: |
          limit_req_status 429;
          limit_req zone=global burst=300 delay=2;
          limit_req zone=ip burst=50 delay=2;
        server-snippet: |
          proxy_intercept_errors on;
          # Cache for all locations. No proxy_cache_valid — honor upstream Cache-Control/Expires.
          proxy_cache go_cache;
          proxy_cache_key "$scheme$host$request_uri";
          proxy_cache_lock on;
          proxy_cache_lock_timeout 30s;
          proxy_cache_lock_age 30s;
          proxy_cache_bypass $http_authorization $cookie_session_token $http_upgrade;
          proxy_no_cache $http_authorization $cookie_session_token $http_upgrade;
          add_header GO-Cache-Status $upstream_cache_status always;
          location = / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://docs_upstream;
          }
          location ^~ /_next/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://docs_upstream;
          }
          location ^~ /assets/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://docs_upstream;
          }
          location ^~ /api/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://docs_upstream;
          }
          location ^~ /reference {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://docs_upstream;
          }
          location ^~ /lab/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://docs_upstream;
          }
          location ^~ /brand/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://docs_upstream;
          }
          location ^~ /files/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://docs_upstream;
          }
          location ^~ /map/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://docs_upstream;
          }
          location = /icon.png {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_pass http://docs_upstream;
          }
          location = /manifest.webmanifest {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_pass http://docs_upstream;
          }
    defaultBackend:
      enabled: true
      name: error-pages
      image:
        registry: docker.io
        image: nginxinc/nginx-unprivileged
        tag: "1.27-alpine"
        pullPolicy: IfNotPresent
        runAsUser: 101
        runAsGroup: 101
        runAsNonRoot: true
        readOnlyRootFilesystem: false
      port: 8080
      replicaCount: 1
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 10m
          memory: 32Mi
      extraVolumes:
        - name: nginx-error-pages
          configMap:
            name: nginx-error-pages
        - name: nginx-error-pages-conf
          configMap:
            name: nginx-error-pages-conf
      extraVolumeMounts:
        - name: nginx-error-pages
          mountPath: /www
          readOnly: true
        - name: nginx-error-pages-conf
          mountPath: /etc/nginx/conf.d
          readOnly: true
