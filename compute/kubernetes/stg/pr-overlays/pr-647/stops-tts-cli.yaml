apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pr-647-stops-tts-cli
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: pr-647-stops
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: pr-647
    module: stops
    app: tts-cli
    replicas: 1
    service:
      targetPort: 8000
    ingress:
      enabled: true
      host: pr-647.go-stg.tmlmobilidade.pt
    secrets:
      - stg-platform-cachedb
      - stg-platform-storage
    env: []
  suspend: false
