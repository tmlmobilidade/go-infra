user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
	use epoll;
	# Must stay ≤ container nofile (default 1024) or nginx warns at start.
	worker_connections 1024;
}

http {

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	log_format main '$time_iso8601 | $status | Cache: $upstream_cache_status | IP $remote_addr | Request: "$request"';
	access_log /var/log/nginx/access.log main;

	aio threads;
	directio 512M;
	output_buffers 2 1M;
	sendfile on;
	tcp_nopush on;

	keepalive_timeout 65;

	gzip on;
	gzip_types application/json;

	# Tile cache: 200s kept 24h; other statuses briefly. inactive=6h without hits.
	proxy_cache_path /var/cache/nginx/tileserver
		levels=1:2
		keys_zone=tileserver_cache:64m
		max_size=20g
		inactive=360m
		use_temp_path=off;

	upstream tileserver_upstream {
		zone upstreams 64K;
		server tileserver:8080 max_fails=2 fail_timeout=2s;
		keepalive 10;
	}

	# HTTP — ACME webroot + redirect to HTTPS
	server {
		listen 80;
		listen [::]:80;
		server_name maps.go.tmlmobilidade.pt;
		server_tokens off;

		location /.well-known/acme-challenge/ {
			root /var/www/certbot;
		}

		location / {
			return 301 https://$host$request_uri;
		}
	}

	# HTTPS → Maps
	server {
		listen 443 ssl;
		listen [::]:443 ssl;
		server_name maps.go.tmlmobilidade.pt;
		server_tokens off;
		http2 on;

		ssl_certificate /etc/letsencrypt/live/maps.go.tmlmobilidade.pt/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/maps.go.tmlmobilidade.pt/privkey.pem;
		include /etc/letsencrypt/options-ssl-nginx.conf;
		ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

		client_max_body_size 16m;

		etag on;
		proxy_cache tileserver_cache;
		proxy_cache_key "$scheme$request_method$host$request_uri";
		proxy_cache_valid 200 24h;
		proxy_cache_valid any 30s;
		proxy_cache_lock on;
		proxy_cache_lock_age 30s;
		proxy_cache_lock_timeout 90s;
		proxy_cache_use_stale error timeout updating;
		proxy_cache_revalidate on;

		proxy_http_version 1.1;
		proxy_connect_timeout 10s;
		proxy_send_timeout 120s;
		proxy_read_timeout 120s;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection "";
		proxy_next_upstream error timeout http_500;

		location / {
			if ($request_method = 'OPTIONS') {
				add_header 'Access-Control-Allow-Origin' "*" always;
				add_header 'Access-Control-Allow-Credentials' 'true' always;
				add_header 'Access-Control-Allow-Headers' "Origin, X-Requested-With, Content-Type, Accept" always;
				add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
				add_header 'Access-Control-Max-Age' 1728000;
				add_header 'Content-Type' 'text/plain; charset=utf-8';
				add_header 'Content-Length' 0;
				return 204;
			}
			proxy_hide_header Access-Control-Allow-Origin;
			add_header Go-Cache-Status $upstream_cache_status always;
			add_header Access-Control-Allow-Origin "*" always;
			add_header Cache-Control "public, max-age=86400" always;
			add_header Strict-Transport-Security "max-age=31536000" always;
			proxy_pass http://tileserver_upstream;
		}
	}

}
