apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pr-573-hub-frontend-navegante-app
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: pr-573-hub
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: pr-573
    module: hub
    app: frontend-navegante-app
    replicas: 1
    service:
      targetPort: 3000
    ingress:
      enabled: true
      path: /hub/navegante-app
      pathType: Prefix
      host: pr-573.go-stg.tmlmobilidade.pt
    env: []
  suspend: false
