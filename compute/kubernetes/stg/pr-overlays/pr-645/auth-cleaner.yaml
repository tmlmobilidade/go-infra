apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pr-645-auth-cleaner
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: pr-645-auth
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: pr-645
    module: auth
    app: cleaner
    replicas: 1
    service:
      targetPort: 5050
    ingress:
      enabled: true
      host: pr-645.go-stg.tmlmobilidade.pt
    secrets:
      - stg-module-auth
      - stg-platform-godb
    env: []
  suspend: false
