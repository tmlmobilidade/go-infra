apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: valhalla-operator
  namespace: flux-system
spec:
  interval: 24h
  url: https://github.com/itayankri/valhalla-operator
  ref:
    tag: v1.4.0
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: valhalla-operator
  namespace: flux-system
spec:
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: valhalla-operator
  path: ./config/default
  prune: true
  wait: true
