apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plans-validator
  namespace: flux-system
spec:
  interval: 5m
  dependsOn:
    - name: onepassword-connect
  targetNamespace: stg-plans
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    module: plans
    replicas: 1
    service:
      targetPort: 5050
    ingress:
      enabled: false
    secrets:
      - stg-platform-storage
      - stg-platform-sentry-plans
      - stg-module-plans
      - stg-platform-godb
      - stg-platform-email
    env: []
    environment: stg
    app: validator
