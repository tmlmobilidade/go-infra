apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pr-633-performance-sync-metrics-daily
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: pr-633-performance
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: pr-633
    module: performance
    app: sync-metrics-daily
    replicas: 1
    service:
      targetPort: 5050
    ingress:
      enabled: true
      host: pr-633.go-stg.tmlmobilidade.pt
    secrets:
      - stg-module-performance
      - stg-platform-godb
      - stg-platform-labdb
    env: []
  suspend: false
