# Quiet static error backend for ingress-nginx custom-http-errors.
# Replaces custom-error-pages (which logs on Accept: */* and missing X-Code).
server {
	listen 8080;
	server_tokens off;
	access_log off;
	error_log /dev/stderr error;
	root /www;
	default_type text/html;

	location = /healthz {
		default_type text/plain;
		return 200 'ok';
	}

	location / {
		set $code $http_x_code;
		if ($code = "") {
			set $code 404;
		}
		error_page 404 500 501 502 503 504 = @error_body;
		return $code;
	}

	location @error_body {
		root /www;
		try_files /$status.html /404.html =404;
	}
}
