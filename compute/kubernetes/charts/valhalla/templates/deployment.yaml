apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}

  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}

{{- with .Values.podAnnotations }}
      annotations:
{{ toYaml . | indent 8 }}
{{- end }}

    spec:

{{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
{{- end }}

      securityContext:
{{ toYaml .Values.podSecurityContext | indent 8 }}

{{- if .Values.initDownload.enabled }}
      initContainers:

        - name: download-osm

          image: {{ .Values.initDownload.image }}

          command:
            - sh
            - -c
            - |
              set -e

              mkdir -p {{ .Values.persistence.mountPath }}

              if [ ! -f "{{ .Values.persistence.mountPath }}/{{ .Values.pbfFileName }}" ]; then
                echo "Downloading Portugal OSM extract..."

                curl -L \
                  "{{ .Values.pbfUrl }}" \
                  -o "{{ .Values.persistence.mountPath }}/{{ .Values.pbfFileName }}"

                echo "Download completed."

              else
                echo "PBF already exists."
              fi

          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}

{{- end }}

      containers:

        - name: valhalla

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.service.port }}

          env:
{{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
{{- end }}

          resources:
{{ toYaml .Values.resources | indent 12 }}

          securityContext:
{{ toYaml .Values.securityContext | indent 12 }}

          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}

          readinessProbe:
            httpGet:
              path: /status
              port: http

            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /status
              port: http

            initialDelaySeconds: 60
            periodSeconds: 20

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" .Values.name) .Values.persistence.existingClaim }}

{{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}

{{- with .Values.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
{{- end }}

{{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
{{- end }}