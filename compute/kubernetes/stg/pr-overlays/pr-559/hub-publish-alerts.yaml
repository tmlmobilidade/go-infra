apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pr-559-hub-publish-alerts
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: pr-559-hub
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: pr-559
    module: hub
    app: publish-alerts
    replicas: 1
    resources:
      memory: 4Gi
    service:
      targetPort: 5050
    ingress:
      enabled: true
      host: pr-559.go-stg.tmlmobilidade.pt
    secrets:
      - stg-platform-cachedb
      - stg-platform-storage
      - stg-module-hub
      - stg-platform-godb
      - stg-platform-sentry-hub
    env: []
  suspend: false
