apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pr-842-tracker-pt-cimat-flaviamobil-api-fetch
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: pr-842-tracker
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/stg/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: pr-842
    module: tracker
    app: pt-cimat-flaviamobil-api-fetch
    replicas: 1
    service:
      targetPort: 5050
    ingress:
      enabled: true
      host: pr-842.go-stg.tmlmobilidade.pt
    secrets:
      - stg-platform-rawdb
      - stg-platform-godb
      - stg-platform-external-app-secrets
    logging:
      enabled: true
      cluster: go-stg
      loki:
        secretName: stg-platform-loki
    env:
      - name: AMI_API_URL
        value: https://amitechonline.flaviamobil.pt/wstrack
  suspend: false
