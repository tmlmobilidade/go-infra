apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: infrastructure-tts-server
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: prd-infrastructure
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: prd
    module: infrastructure
    app: tts-server
    replicas: 1
    resources:
      memory: 12Gi
      cpu: 4000m
    service:
      targetPort: 8000
    ingress:
      enabled: false
    secrets:
      - prd-module-infrastructure
      - prd-platform-godb
      - prd-platform-storage
      - prd-platform-sentry
    env: []