volumes:
  certbotdata:

secrets:
  cloudflaretoken:
    file: ./secrets/cloudflare.token

services:
  watchtower:
    image: nickfedor/watchtower
    container_name: maps-watchtower
    deploy:
      restart_policy:
        condition: on-failure
        delay: 30s
      resources:
        limits:
          memory: 1gb
    logging:
      options:
        max-size: '1m'
        max-file: '1'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=60
      - WATCHTOWER_CLEANUP=TRUE
      - WATCHTOWER_INCLUDE_STOPPED=TRUE
      - WATCHTOWER_REVIVE_STOPPED=TRUE
      - WATCHTOWER_ROLLING_RESTART=TRUE

  nginx:
    image: nginx:alpine
    container_name: maps-nginx
    restart: unless-stopped
    logging:
      options:
        max-size: '1m'
        max-file: '1'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./letsencrypt:/etc/letsencrypt:ro
      - certbotdata:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    command: "/bin/sh -c 'while :; do sleep 6h; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/dns-cloudflare
    container_name: maps-certbot
    restart: unless-stopped
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - certbotdata:/var/www/certbot
    secrets:
      - cloudflaretoken
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  planetiler:
    image: ghcr.io/tmlmobilidade/planetiler:latest
    container_name: maps-planetiler
    deploy:
      restart_policy:
        condition: on-failure
        delay: 30s
      resources:
        limits:
          memory: 16gb
    logging:
      options:
        max-size: '1m'
        max-file: '1'
    volumes:
      - /opt/app/persistent-data/tileserver:/output
      - /opt/app/persistent-data/planetiler-data:/data


  tileserver:
    image: ghcr.io/tmlmobilidade/tileserver:latest
    container_name: maps-tileserver
    deploy:
      restart_policy:
        condition: on-failure
        delay: 30s
      resources:
        limits:
          memory: 2gb
    logging:
      options:
        max-size: '1m'
        max-file: '1'
    volumes:
      - /opt/app/persistent-data/tileserver:/data