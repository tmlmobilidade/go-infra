name: valhalla

pbfUrl: https://download.geofabrik.de/europe/portugal-latest.osm.pbf

minReplicas: 1
maxReplicas: 2

persistence:
  storage: 50Gi
  storageClassName: ""
  accessMode: ReadWriteMany

resources:
  requests:
    cpu: "2000m"
    memory: "4Gi"
  limits:
    cpu: "4000m"
    memory: "8Gi"

service:
  type: ClusterIP
  annotations: {}

# Daily Portugal OSM refresh (same flow as VM update-portugal-osm.sh).
updateCron:
  enabled: false
  schedule: "0 4 * * *"
  timeZone: Europe/Lisbon
  image: bitnami/kubectl:1.31.4
  mountPath: /custom_files
  pbfFileName: portugal-latest.osm.pbf
  pvcClaimName: valhalla-pvc
  deploymentName: valhalla
