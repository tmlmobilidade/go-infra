apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pr-725-core-frontend
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: pr-725-core
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/stg/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: pr-725
    module: core
    app: frontend
    replicas: 1
    service:
      targetPort: 3000
    ingress:
      enabled: true
      path: /core
      pathType: Prefix
      host: pr-725.go-stg.tmlmobilidade.pt
    probes:
      startup:
        enabled: true
        path: /core/health
    logging:
      enabled: true
      cluster: go-stg
      loki:
        secretName: stg-platform-loki
    env: []
  suspend: false
