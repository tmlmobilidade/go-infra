apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ingress-nginx-charts
  namespace: flux-system
spec:
  interval: 1h
  url: https://kubernetes.github.io/ingress-nginx
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: ingress-nginx
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: ingress-nginx
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx-charts
        namespace: flux-system
      interval: 1h
  values:
    controller:
      # Public OCI Network Load Balancer (internet-facing).
      # Virtual Nodes: use Pods as Backends (targetPort 80/443), not NodePort —
      # NodePort on pod IPs times out and leaves backend sets Critical.
      service:
        type: LoadBalancer
        allocateLoadBalancerNodePorts: false
        annotations:
          oci.oraclecloud.com/load-balancer-type: "nlb"
          oci-network-load-balancer.oraclecloud.com/internal: "false"
          oci-network-load-balancer.oraclecloud.com/assigned-private-ipv4: "10.91.101.2"
          oci-network-load-balancer.oraclecloud.com/subnet: "ocid1.subnet.oc1.eu-frankfurt-1.aaaaaaaabxgcifumk7or4z5kbdj6l6tkox3xqzpnmvhmq3l5hruveil4ze3q"
          # Enables Pods as Backends; health-check on container ports
          oci-network-load-balancer.oraclecloud.com/health-check: '{"protocol":"TCP","port":80,"retries":3,"timeoutInMillis":3000,"intervalInMillis":10000}'
      # Gateway-like: one wildcard cert on the controller (no per-namespace Secrets / reflector)
      extraArgs:
        default-ssl-certificate: "ingress-nginx/go-stg-tls"
      watchIngressWithoutClass: false
      ingressClassResource:
        name: nginx
        enabled: true
        default: true
      config:
        use-forwarded-headers: "false"
        compute-full-forwarded-for: "false"
