#cloud-config

# -----------------------------------------------------------------------
# cloud-init.yaml — ClickHouse Replica Node (node_index = ${node_index})
#
# Docker and OS tuning are pre-baked into the Packer image.
# This file handles runtime concerns only:
#   - Attaches and mounts the 1TB block volume
#   - Writes ClickHouse Keeper config (embedded keeper, 3-node Raft quorum)
#   - Writes ZooKeeper client config (points CH to keeper endpoints)
#   - Writes replica macros and cluster config
#   - Writes tuning, system-log retention and profiling config
#   - Writes secrets and starts the container
#
# Terraform variables injected:
#   node_index, all_private_ips, clickhouse_admin_password,
#   clickhouse_http_port, clickhouse_tcp_port
#
# Note: ports are hardcoded in packer/templates/compose.yaml
#   and only referenced here for the XML configuration files.
# -----------------------------------------------------------------------

packages:
  - xfsprogs

runcmd:

  # 1.
  # Attach and mount the block volume
  # using the script pre-packed by Packer

  - /opt/app/attach-volume.sh
  - rm /opt/app/attach-volume.sh

  # 2.
  # Configure the firewall to allow ClickHouse traffic
  # using the script pre-packed by Packer

  - /opt/app/firewall.sh
  - rm /opt/app/firewall.sh

  # 3.
  # Setup ClickHouse Directories
  # using the script pre-packed by Packer

  - /opt/app/setup-clickhouse.sh
  - rm /opt/app/setup-clickhouse.sh

  # 4.
  # Network Config to instruct Clickhouse to listen
  # on all network interfaces (IPv4 only). `interserver_http_host`
  # sets the current node's private IP to allow cluster communication.

  - |
    cat > /opt/app/persistent-data/config.d/network.xml <<'NETEOF'
    <clickhouse>
        <listen_host>0.0.0.0</listen_host>
        <interserver_http_host>${all_private_ips[node_index]}</interserver_http_host>
    </clickhouse>
    NETEOF

  # 5.
  # ZooKeeper Client Config (replicated 3-node Keeper cluster)
  # Points ClickHouse at all 3 Keeper nodes for high availability.
  # If a Keeper node is down, ClickHouse will automatically failover
  # to the next available node.

  - |
    cat > /opt/app/persistent-data/config.d/keeper.xml <<'KEEPEREOF'
    <clickhouse>
        <keeper_server>
            <!-- ZooKeeper-compatible client port -->
            <tcp_port>2181</tcp_port>
            <!-- Unique server ID for this node (1, 2, or 3) -->
            <server_id>${node_index + 1}</server_id>
            <log_storage_path>/var/lib/clickhouse/coordination/log</log_storage_path>
            <snapshot_storage_path>/var/lib/clickhouse/coordination/snapshots</snapshot_storage_path>
            <coordination_settings>
                <operation_timeout_ms>10000</operation_timeout_ms>
                <session_timeout_ms>30000</session_timeout_ms>
                <raft_logs_level>warning</raft_logs_level>
            </coordination_settings>
            <raft_configuration>
            %{ for idx in range(length(all_private_ips)) ~}
                <server>
                    <id>${idx + 1}</id>
                    <hostname>${all_private_ips[idx]}</hostname>
                    <!-- Inter-keeper Raft port -->
                    <port>9444</port>
                </server>
            %{ endfor ~}
            </raft_configuration>
        </keeper_server>
    </clickhouse>
    KEEPEREOF

  # 6.
  # ZooKeeper Client Config — points ClickHouse at all 3 Keeper nodes
  # Points ClickHouse at all 3 Keeper nodes for high availability.
  # If a Keeper node is down, ClickHouse will automatically failover
  # to the next available node.

  - |
    cat > /opt/app/persistent-data/config.d/zookeeper.xml <<'ZKEOF'
    <clickhouse>
        <zookeeper>
        %{ for node_ip in all_private_ips ~}
            <node>
                <host>${node_ip}</host>
                <port>2181</port>
            </node>
        %{ endfor ~}
        </zookeeper>
    </clickhouse>
    ZKEOF

  # 7.
  # Replica Macros
  # node-specific identity for ReplicatedMergeTree

  - |
    cat > /opt/app/persistent-data/config.d/macros.xml <<'MACROEOF'
    <clickhouse>
        <macros>
            <shard>01</shard>
            <replica>replica-${node_index + 1}</replica>
            <cluster>default_cluster</cluster>
        </macros>
    </clickhouse>
    MACROEOF

  # 8.
  # Cluster Config — all 3 replicas in one shard (no sharding)

  - |
    cat > /opt/app/persistent-data/config.d/cluster.xml <<'CLUSTEREOF'
    <clickhouse>
        <remote_servers>
            <default_cluster>
                <shard>
                %{ for ip in all_private_ips ~}
                  <replica>
                      <host>${ip}</host>
                      <port>${clickhouse_tcp_port}</port>
                  </replica>
                %{ endfor ~}
                  <internal_replication>true</internal_replication>
                </shard>
            </default_cluster>
        </remote_servers>
    </clickhouse>
    CLUSTEREOF

  # 9.
  # Performance Tuning Config (server-level)

  - |
    cat > /opt/app/persistent-data/config.d/tuning.xml <<'TUNEOEOF'
    <clickhouse>
        <!-- Server-level memory: 85% of 12GB = ~10.2GB -->
        <max_server_memory_usage_to_ram_ratio>0.85</max_server_memory_usage_to_ram_ratio>
        <uncompressed_cache_size>2147483648</uncompressed_cache_size>
        <mark_cache_size>2147483648</mark_cache_size>
        <!-- Enable Prometheus metrics -->
        <prometheus>
            <endpoint>/metrics</endpoint>
            <port>9363</port>
            <metrics>true</metrics>
            <events>true</events>
        </prometheus>
    </clickhouse>
    TUNEOEOF

  # 10.
  # User Profile Config (user-level memory limit, CH 26+)

  - |
    cat > /opt/app/persistent-data/users.d/tuning.xml <<'USERUEOF'
    <clickhouse>
        <profiles>
            <default>
                <max_memory_usage>48G</max_memory_usage>
                <!--
                    Async insert batching. Buffer incoming rows for at least 1s
                    and at most 5s (or 100MB) before writing a part to disk.
                    Without this, ClickHouse flushes every 200ms and creates
                    thousands of tiny parts per minute that must then be merged.
                    Clients using `wait_for_async_insert = 1` block up to 5s.
                -->
                <async_insert_busy_timeout_min_ms>1000</async_insert_busy_timeout_min_ms>
                <async_insert_busy_timeout_max_ms>5000</async_insert_busy_timeout_max_ms>
                <async_insert_max_data_size>104857600</async_insert_max_data_size>
            </default>
        </profiles>
    </clickhouse>
    USERUEOF

  # 11.
  # Logging Config (server-level)

  - |
    cat > /opt/app/persistent-data/config.d/logger.xml <<'USERUEOF'
    <clickhouse>
        <logger>
            <level>information</level>
            <console>1</console>
        </logger>
    </clickhouse>
    USERUEOF

  # 12.
  # System Log Tables (server-level)
  #
  # By default ClickHouse writes every query, every trace sample and every
  # processor step into `system.*` tables and never deletes them. On this node
  # that grew past 1TB and produced multi-hour background merges.
  #
  # `remove="1"` deletes the table's config section entirely, so the table is
  # never created. The other tables keep a short TTL and daily partitions;
  # `ttl_only_drop_parts = 1` lets expiry drop a whole day's partition file
  # instead of rewriting parts row by row.
  #
  # Use the short-form keys rather than a full <engine> string. Files in
  # config.d merge into the shipped config.xml, which already defines
  # <partition_by> for these tables, and ClickHouse refuses to start if both
  # are present. The short form also preserves each table's built-in ORDER BY
  # and engine settings (metric_log needs its own for bucketed columns).
  #
  # Note: changing the definition of an existing system table makes ClickHouse
  # rename the old one (e.g. `query_log_1`) on restart. Renamed tables stop
  # merging but keep their disk space until dropped manually.

  - |
    cat > /opt/app/persistent-data/config.d/logs.xml <<'LOGSEOF'
    <clickhouse>
        <!-- Disabled: high write volume, no operational use here -->
        <query_metric_log remove="1"/>
        <processors_profile_log remove="1"/>
        <!-- Kept with daily partitions and a short retention -->
        <query_log>
            <partition_by>toYYYYMMDD(event_date)</partition_by>
            <ttl>event_date + INTERVAL 14 DAY DELETE</ttl>
            <settings>ttl_only_drop_parts = 1</settings>
        </query_log>
        <part_log>
            <partition_by>toYYYYMMDD(event_date)</partition_by>
            <ttl>event_date + INTERVAL 7 DAY DELETE</ttl>
            <settings>ttl_only_drop_parts = 1</settings>
        </part_log>
        <metric_log>
            <partition_by>toYYYYMMDD(event_date)</partition_by>
            <ttl>event_date + INTERVAL 7 DAY DELETE</ttl>
            <settings>ttl_only_drop_parts = 1</settings>
        </metric_log>
        <asynchronous_metric_log>
            <partition_by>toYYYYMMDD(event_date)</partition_by>
            <ttl>event_date + INTERVAL 7 DAY DELETE</ttl>
            <settings>ttl_only_drop_parts = 1</settings>
        </asynchronous_metric_log>
        <trace_log>
            <partition_by>toYYYYMMDD(event_date)</partition_by>
            <ttl>event_date + INTERVAL 3 DAY DELETE</ttl>
            <settings>ttl_only_drop_parts = 1</settings>
        </trace_log>
        <text_log>
            <partition_by>toYYYYMMDD(event_date)</partition_by>
            <ttl>event_date + INTERVAL 3 DAY DELETE</ttl>
            <settings>ttl_only_drop_parts = 1</settings>
        </text_log>
        <query_views_log>
            <partition_by>toYYYYMMDD(event_date)</partition_by>
            <ttl>event_date + INTERVAL 3 DAY DELETE</ttl>
            <settings>ttl_only_drop_parts = 1</settings>
        </query_views_log>
    </clickhouse>
    LOGSEOF

  # 13.
  # Profiling Collection (user-level)
  #
  # Stops the data from being produced in the first place: no per-processor
  # profiles, no sampling profiler stacks, no per-query metric sampling.
  # Re-enable ad hoc for a single investigation with
  # `SET query_profiler_real_time_period_ns = 10000000`.

  - |
    cat > /opt/app/persistent-data/users.d/logging.xml <<'LOGGINGEOF'
    <clickhouse>
        <profiles>
            <default>
                <log_processors_profiles>0</log_processors_profiles>
                <query_profiler_real_time_period_ns>0</query_profiler_real_time_period_ns>
                <query_profiler_cpu_time_period_ns>0</query_profiler_cpu_time_period_ns>
                <query_metric_log_interval>0</query_metric_log_interval>
            </default>
        </profiles>
    </clickhouse>
    LOGGINGEOF

  # 14.
  # Write Secrets

  - |
    mkdir -p /opt/app/secrets
    cat > /opt/app/secrets/.env <<'ENVEOF'
    CLICKHOUSE_PASSWORD=${clickhouse_admin_password}
    CLICKHOUSE_USER=admin
    ENVEOF

  # 15.
  # Start ClickHouse

  - cd /opt/app && docker compose up -d --build --force-recreate --remove-orphans --pull=always

final_message: "ClickHouse replica node ${node_index + 1} of ${length(all_private_ips)} configuration complete."
