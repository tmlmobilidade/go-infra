apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: operation-gtfs-validator
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: prd-operation
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: prd
    module: operation
    app: gtfs-validator
    replicas: 1
    service:
      targetPort: 5050
    resources:
      cpu: 6000m
      memory: 12Gi
    ingress:
      enabled: false
    secrets:
      - prd-platform-godb
      - prd-platform-storage
      - prd-platform-email
      - prd-platform-sentry
    env: []