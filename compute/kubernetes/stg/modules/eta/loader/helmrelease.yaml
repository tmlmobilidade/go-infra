apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: eta-loader
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: stg-eta
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: stg
    module: eta
    app: loader
    replicas: 1
    service:
      targetPort: 5050
    resources:
      memory: 6Gi
      cpu: 4000m
    ingress:
      enabled: false
    secrets:
      - stg-module-eta
    env: []
