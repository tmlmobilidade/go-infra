apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pr-559-alerts-api
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: pr-559-alerts
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: pr-559
    module: alerts
    app: api
    replicas: 1
    resources:
      memory: 4Gi
    service:
      targetPort: 5050
    ingress:
      enabled: true
      path: /alerts/api(/|$)(.*)
      pathType: ImplementationSpecific
      annotations:
        nginx.ingress.kubernetes.io/use-regex: "true"
        nginx.ingress.kubernetes.io/rewrite-target: /$2
      host: pr-559.go-stg.tmlmobilidade.pt
    secrets:
      - stg-platform-ai
      - stg-platform-storage
      - stg-module-alerts
      - stg-platform-godb
      - stg-platform-sentry
    probes:
      startup:
        enabled: true
    env: []
  suspend: false
