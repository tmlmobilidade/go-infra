apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hub-frontend
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: prd-hub
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: prd
    module: hub
    app: frontend-videowall
    replicas: 1
    service:
      targetPort: 3000
    ingress:
      enabled: true
      path: /hub/videowall
      pathType: Prefix
    secrets:
      - prd-platform-sentry
    env: []
