apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hub-api
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: prd-hub
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: prd
    module: hub
    app: api
    replicas: 3
    resources:
      memory: 4Gi
      cpu: 2
    service:
      targetPort: 5050
    ingress:
      enabled: true
      path: /hub/api(/|$)(.*)
      pathType: ImplementationSpecific
      annotations:
        nginx.ingress.kubernetes.io/use-regex: "true"
        nginx.ingress.kubernetes.io/rewrite-target: /$2
    secrets:
      - prd-platform-godb
      - prd-platform-cachedb
      - prd-platform-storage
      - prd-platform-sentry
      - prd-platform-labdb
    probes:
      startup:
        enabled: true
    env: []