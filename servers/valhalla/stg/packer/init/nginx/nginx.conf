user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
	worker_connections 1024;
}

http {

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	log_format main '$time_iso8601 | $status | IP $remote_addr | Request: "$request"';
	access_log /var/log/nginx/access.log main;

	sendfile on;
	keepalive_timeout 65;

	gzip on;
	gzip_types application/json;

	upstream valhalla_upstream {
		server valhalla:8002;
		keepalive 8;
	}

	# HTTP — ACME webroot + proxy (LE HTTP-01 hits here)
	server {
		listen 80;
		listen [::]:80;
		server_name valhalla-stg.go.tmlmobilidade.pt;
		server_tokens off;

		location /.well-known/acme-challenge/ {
			root /var/www/certbot;
		}

		location / {
			return 301 https://$host$request_uri;
		}
	}

	# HTTPS → Valhalla
	server {
		listen 443 ssl;
		listen [::]:443 ssl;
		server_name valhalla-stg.go.tmlmobilidade.pt;
		server_tokens off;
		http2 on;

		ssl_certificate /etc/letsencrypt/live/valhalla-stg.go.tmlmobilidade.pt/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/valhalla-stg.go.tmlmobilidade.pt/privkey.pem;
		include /etc/letsencrypt/options-ssl-nginx.conf;
		ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

		client_max_body_size 16m;

		proxy_http_version 1.1;
		proxy_connect_timeout 10s;
		proxy_send_timeout 120s;
		proxy_read_timeout 120s;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header Connection "";

		location / {
			proxy_pass http://valhalla_upstream;
		}
	}

}
