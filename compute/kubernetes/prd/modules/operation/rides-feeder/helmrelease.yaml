apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: operation-rides-feeder
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: prd-operation
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: prd
    module: operation
    app: rides-feeder
    replicas: 3
    resources:
      memory: 8Gi
      cpu: 4000m
    ingress:
      enabled: false
    secrets:
      - prd-platform-godb
      - prd-platform-labdb
      - prd-platform-storage
      - prd-platform-sentry
    env: []