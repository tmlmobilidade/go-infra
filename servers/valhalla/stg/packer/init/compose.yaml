# # #
volumes:
  certbotdata:

secrets:
  cloudflaretoken:
    file: ./secrets/cloudflare.token

services:
  valhalla:
    image: ghcr.io/tmlmobilidade/valhalla:latest
    container_name: valhalla
    restart: unless-stopped
    extra_hosts:
      - "go-stg-valhalla-1.tmlmobilidade.pt:10.91.101.241"
    logging:
      options:
        max-size: '10m'
        max-file: '3'
    volumes:
      - /opt/app/persistent-data/custom_files:/custom_files
    environment:
      - server_threads=4
      - serve_tiles=True
      - use_tiles_ignore_pbf=False
      - tileset_name=valhalla_tiles
      - build_elevation=False
      - build_admins=False
      - build_time_zones=False
      - build_transit=False
      - build_tar=True
      - force_rebuild=False
      - update_existing_config=True
      - TZ=Europe/Lisbon

  certbot:
    image: certbot/dns-cloudflare
    container_name: valhalla-certbot
    restart: unless-stopped
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - certbotdata:/var/www/certbot
    secrets:
      - cloudflaretoken
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  nginx:
    image: nginx:alpine
    container_name: valhalla-nginx
    restart: unless-stopped
    depends_on:
      - valhalla
    logging:
      options:
        max-size: '1m'
        max-file: '1'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./letsencrypt:/etc/letsencrypt:ro
      - certbotdata:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    command: "/bin/sh -c 'while :; do sleep 6h; nginx -s reload; done & nginx -g \"daemon off;\"'"
