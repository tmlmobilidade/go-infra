{{- if .Values.updateCron.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.name }}-updater

subjects:
  - kind: ServiceAccount
    name: {{ .Values.name }}-updater

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.name }}-updater
{{- end }}