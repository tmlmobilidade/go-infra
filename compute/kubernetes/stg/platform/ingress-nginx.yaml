apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ingress-nginx-charts
  namespace: flux-system
spec:
  interval: 1h
  url: https://kubernetes.github.io/ingress-nginx
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: ingress-nginx
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: ingress-nginx
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx-charts
        namespace: flux-system
      interval: 1h
  values:
    controller:
      replicaCount: 3
      # Public OCI Network Load Balancer (internet-facing).
      # Virtual Nodes: use Pods as Backends (targetPort 80/443), not NodePort —
      # NodePort on pod IPs times out and leaves backend sets Critical.
      service:
        type: LoadBalancer
        allocateLoadBalancerNodePorts: false
        externalTrafficPolicy: Cluster
        annotations:
          oci.oraclecloud.com/load-balancer-type: "nlb"
          oci-network-load-balancer.oraclecloud.com/internal: "false"
          oci-network-load-balancer.oraclecloud.com/assigned-private-ipv4: "10.91.101.2"
          oci-network-load-balancer.oraclecloud.com/subnet: "ocid1.subnet.oc1.eu-frankfurt-1.aaaaaaaabxgcifumk7or4z5kbdj6l6tkox3xqzpnmvhmq3l5hruveil4ze3q"
          oci-network-load-balancer.oraclecloud.com/health-check: '{"protocol":"TCP","retries":3,"timeoutInMillis":3000,"intervalInMillis":10000}'
      extraArgs:
        default-ssl-certificate: "ingress-nginx/go-stg-tls"
      # Allow ConfigMap server-snippet (docs routing)
      allowSnippetAnnotations: true
      annotationRiskLevel: Critical
      watchIngressWithoutClass: false
      ingressClassResource:
        name: nginx
        enabled: true
        default: true
      config:
        server-tokens: "false"
        use-forwarded-headers: "true"
        compute-full-forwarded-for: "true"
        use-http2: "true"
        ssl-redirect: "true"
        proxy-body-size: "1g"
        proxy-connect-timeout: "10"
        proxy-send-timeout: "20"
        proxy-read-timeout: "20"
        client-body-timeout: "300"
        keep-alive: "65"
        upstream-keepalive-connections: "16"
        upstream-keepalive-timeout: "10"
        use-gzip: "true"
        gzip-types: "application/json"
        proxy-buffering: "on"
        # Intercept these statuses and proxy to chart defaultBackend.
        custom-http-errors: "404,500,501,502,503,504"
        http-snippet: |
          upstream docs_upstream {
            least_conn;
            server stg-docs.stg-docs.svc.cluster.local:80 max_fails=3 fail_timeout=5s;
            keepalive 10;
          }
        server-snippet: |
          # Inherit custom-http-errors for docs locations (snippet locations omit chart defaults).
          proxy_intercept_errors on;
          location = / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://docs_upstream;
          }
          location ^~ /_next/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://docs_upstream;
          }
          location ^~ /assets/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://docs_upstream;
          }
          location ^~ /api/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://docs_upstream;
          }
          location ^~ /reference {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://docs_upstream;
          }
          location ^~ /lab/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://docs_upstream;
          }
          location ^~ /brand/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://docs_upstream;
          }
          location ^~ /files/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://docs_upstream;
          }
          location ^~ /map/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://docs_upstream;
          }
          location = /icon.png {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_pass http://docs_upstream;
          }
          location = /manifest.webmanifest {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_pass http://docs_upstream;
          }
    # Chart-managed default backend (wires --default-backend-service automatically).
    # HTML from ConfigMap nginx-error-pages (platform/nginx-error-pages).
    defaultBackend:
      enabled: true
      name: error-pages
      image:
        registry: registry.k8s.io
        image: ingress-nginx/custom-error-pages
        tag: "v1.2.9"
      replicaCount: 1
      # Virtual Nodes: requests must equal limits.
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 10m
          memory: 32Mi
      extraVolumes:
        - name: nginx-error-pages
          configMap:
            name: nginx-error-pages
            items:
              - key: 404.html
                path: 404.ehtml
              - key: 500.html
                path: 500.ehtml
              - key: 501.html
                path: 501.ehtml
              - key: 502.html
                path: 502.ehtml
              - key: 503.html
                path: 503.ehtml
              - key: 504.html
                path: 504.ehtml
      extraVolumeMounts:
        - name: nginx-error-pages
          mountPath: /www
          readOnly: true
