apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pr-704-hub-publish-alerts
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: pr-704-hub
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/stg/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: pr-704
    module: hub
    app: publish-alerts
    replicas: 1
    resources:
      memory: 4Gi
    service:
      targetPort: 5050
    ingress:
      enabled: true
      host: pr-704.go-stg.tmlmobilidade.pt
    secrets:
      - stg-platform-godb
      - stg-platform-labdb
      - stg-platform-cachedb
      - stg-platform-storage
    logging:
      enabled: true
      cluster: go-stg
      loki:
        secretName: stg-platform-loki
    env: []
  suspend: false
