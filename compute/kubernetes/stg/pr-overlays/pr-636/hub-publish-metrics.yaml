apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pr-636-hub-publish-metrics
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: pr-636-hub
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: pr-636
    module: hub
    app: publish-metrics
    replicas: 1
    service:
      targetPort: 5050
    ingress:
      enabled: true
      host: pr-636.go-stg.tmlmobilidade.pt
    secrets:
      - stg-platform-godb
      - stg-platform-labdb
      - stg-platform-cachedb
    env: []
  suspend: false
