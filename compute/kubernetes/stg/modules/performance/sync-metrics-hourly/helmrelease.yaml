apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: performance-sync-metrics-hourly
  namespace: flux-system
spec:
  interval: 5m
  dependsOn:
    - name: onepassword-connect
  targetNamespace: stg-performance
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: stg
    module: performance
    app: sync-metrics-hourly
    replicas: 1
    service:
      targetPort: 5050
    ingress:
      enabled: false
    secrets:
      - stg-module-performance
      - stg-platform-godb
      - stg-platform-labdb
    env: []