environment: environment
module: module
app: app

replicas: 1

service:
  targetPort: 5050

resources:
  cpu: 1000m
  memory: 512Mi

ingress:
  enabled: false
  path: /
  pathType: Prefix
  annotations: {}

secrets: []

env: []

probes:
  waitForApi:
    enabled: false
    port: 5050
    path: /api/health
    periodSeconds: 5
