apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pr-559-controller-api
  namespace: flux-system
spec:
  interval: 5m
  dependsOn:
    - name: onepassword-connect
  targetNamespace: pr-559-controller
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: pr-559
    module: controller
    app: api
    replicas: 1
    service:
      targetPort: 5050
    ingress:
      enabled: true
      path: /controller/api(/|$)(.*)
      pathType: ImplementationSpecific
      annotations:
        nginx.ingress.kubernetes.io/use-regex: "true"
        nginx.ingress.kubernetes.io/rewrite-target: /$2
      host: pr-559.go-stg.tmlmobilidade.pt
    secrets:
      - stg-module-controller
      - stg-platform-godb
      - stg-platform-labdb
      - stg-platform-email
    env: []
  suspend: false
