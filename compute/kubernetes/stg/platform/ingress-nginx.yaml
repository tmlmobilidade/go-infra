# STG: F5 NGINX Ingress Controller (replaces deprecated kubernetes/ingress-nginx).
# Chart: nginx-ingress from oci://ghcr.io/nginx/charts
# Cutover: Flux removes HelmRelease ingress-nginx and installs nginx-ingress;
# IngressClass name stays "nginx" so existing Ingresses keep working.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nginx-ingress-charts
  namespace: flux-system
spec:
  interval: 1h
  type: oci
  url: oci://ghcr.io/nginx/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx-ingress
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: ingress-nginx
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: nginx-ingress
      version: "2.9.0"
      sourceRef:
        kind: HelmRepository
        name: nginx-ingress-charts
        namespace: flux-system
      interval: 1h
  values:
    controller:
      replicaCount: 3
      enableSnippets: true
      # Public OCI Network Load Balancer (internet-facing).
      # Virtual Nodes: use Pods as Backends (targetPort 80/443), not NodePort —
      # NodePort on pod IPs times out and leaves backend sets Critical.
      service:
        type: LoadBalancer
        allocateLoadBalancerNodePorts: false
        externalTrafficPolicy: Cluster
        annotations:
          oci.oraclecloud.com/load-balancer-type: "nlb"
          oci-network-load-balancer.oraclecloud.com/internal: "false"
          oci-network-load-balancer.oraclecloud.com/assigned-private-ipv4: "10.91.101.2"
          oci-network-load-balancer.oraclecloud.com/subnet: "ocid1.subnet.oc1.eu-frankfurt-1.aaaaaaaabxgcifumk7or4z5kbdj6l6tkox3xqzpnmvhmq3l5hruveil4ze3q"
          oci-network-load-balancer.oraclecloud.com/health-check: '{"protocol":"TCP","retries":3,"timeoutInMillis":3000,"intervalInMillis":10000}'
      # TLS for hosts without their own secret (was --default-ssl-certificate).
      wildcardTLS:
        secret: ingress-nginx/go-stg-tls
      ingressClass:
        name: nginx
        create: true
        setAsDefaultIngress: true
      config:
        entries:
          server-tokens: "false"
          http2: "true"
          ssl-redirect: "true"
          client-max-body-size: "2g"
          proxy-connect-timeout: "10s"
          proxy-send-timeout: "60s"
          proxy-read-timeout: "60s"
          keepalive-timeout: "65s"
          keepalive: "16"
          proxy-buffering: "true"
          http-snippets: |
            # Frontend documents and Next.js navigation must follow the current deployment.
            map $http_accept $go_frontend_request {
              default 0;
              ~*text/(?:html|x-component) 1;
            }
            map $upstream_http_content_type $go_frontend_response {
              default 0;
              "~*^text/(?:html|x-component)(?:;|$)" 1;
            }
            # Cache zone (gateway-style): only used when upstream sends Cache-Control/Expires.
            proxy_cache_path /tmp/nginx-cache
              levels=1:2
              keys_zone=go_cache:10m
              max_size=1g
              inactive=1h
              use_temp_path=off;
          server-snippets: |
            # Honor upstream cache headers, except for frontend HTML and navigation.
            proxy_cache go_cache;
            # Retire entries written before HTML and navigation were excluded.
            proxy_cache_key "v2:$scheme$request_method$host$request_uri";
            proxy_cache_lock on;
            proxy_cache_lock_timeout 30s;
            proxy_cache_lock_age 30s;
            proxy_cache_bypass $http_authorization $cookie_session_token $http_upgrade $http_rsc $go_frontend_request;
            proxy_no_cache $http_authorization $cookie_session_token $http_upgrade $http_rsc $go_frontend_request $go_frontend_response;
            add_header Go-Cache-Status $upstream_cache_status always;
            # Custom error pages (replaces community defaultBackend / custom-http-errors).
            proxy_intercept_errors on;
            error_page 404 500 501 502 503 504 = @go_error_pages;
            location @go_error_pages {
              internal;
              proxy_intercept_errors off;
              proxy_method GET;
              proxy_http_version 1.1;
              proxy_set_header Connection "";
              proxy_set_header X-Code $status;
              # Named locations cannot use proxy_pass with a URI part — rewrite then pass host only.
              rewrite ^ / break;
              proxy_pass http://error-pages.ingress-nginx.svc.cluster.local:8080;
            }
            location = / {
              rewrite ^/$ /core permanent;
            }
