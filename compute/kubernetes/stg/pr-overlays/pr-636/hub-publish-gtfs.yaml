apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pr-636-hub-publish-gtfs
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: pr-636-hub
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: pr-636
    module: hub
    app: publish-gtfs
    replicas: 1
    resources:
      memory: 4Gi
    service:
      targetPort: 5050
    ingress:
      enabled: true
      host: pr-636.go-stg.tmlmobilidade.pt
    secrets:
      - stg-platform-godb
      - stg-platform-cachedb
      - stg-platform-storage
    env: []
  suspend: false
  # TEST: Alloy sidecar on this PR pod only (VN-safe, own-pod tail).
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: pr-636-hub-publish-gtfs
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: pr-636-hub-publish-gtfs
              spec:
                template:
                  spec:
                    serviceAccountName: pr-636-hub-publish-gtfs
                    containers:
                      - name: log-shipper
                        image: docker.io/grafana/alloy:v1.12.1
                        imagePullPolicy: IfNotPresent
                        args:
                          - run
                          - /etc/alloy/config.alloy
                          - --storage.path=/tmp/alloy
                          - --server.http.listen-addr=127.0.0.1:12345
                          - --stability.level=generally-available
                        env:
                          - name: POD_NAME
                            valueFrom:
                              fieldRef:
                                fieldPath: metadata.name
                          - name: POD_NAMESPACE
                            valueFrom:
                              fieldRef:
                                fieldPath: metadata.namespace
                          - name: HOSTNAME
                            valueFrom:
                              fieldRef:
                                fieldPath: metadata.name
                          - name: LOKI_USERNAME
                            valueFrom:
                              secretKeyRef:
                                name: stg-platform-loki
                                key: username
                          - name: LOKI_PASSWORD
                            valueFrom:
                              secretKeyRef:
                                name: stg-platform-loki
                                key: password
                        resources:
                          requests:
                            cpu: 50m
                            memory: 128Mi
                          limits:
                            cpu: 50m
                            memory: 128Mi
                        volumeMounts:
                          - name: alloy-config
                            mountPath: /etc/alloy
                            readOnly: true
                          - name: alloy-data
                            mountPath: /tmp/alloy
                    volumes:
                      - name: alloy-config
                        configMap:
                          name: pr-636-hub-publish-gtfs-logging
                      - name: alloy-data
                        emptyDir: {}

