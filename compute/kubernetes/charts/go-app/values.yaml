environment: environment
module: module
app: app

replicas: 1

deployment:
  strategy:
    maxSurge: 1
    maxUnavailable: 0

service:
  targetPort: 5050

resources:
  cpu: 1000m
  memory: 512Mi

ingress:
  enabled: false
  path: /
  pathType: Prefix
  annotations: {}

secrets: []

env: []

probes:
  startup:
    enabled: false
    path: /health
    failureThreshold: 5
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 30
  readiness:
    failureThreshold: 5
    periodSeconds: 30
    successThreshold: 1
    timeoutSeconds: 30