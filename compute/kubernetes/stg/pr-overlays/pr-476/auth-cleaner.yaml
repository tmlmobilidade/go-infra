apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pr-476-auth-cleaner
  namespace: flux-system
spec:
  interval: 5m
  dependsOn:
    - name: onepassword-connect
  targetNamespace: pr-476-auth
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    module: auth
    replicas: 1
    service:
      targetPort: 5050
    ingress:
      enabled: true
      host: pr-476.go-stg.tmlmobilidade.pt
    secrets:
      - stg-platform-storage
    env: []
    environment: pr-476
    app: cleaner
  suspend: false
