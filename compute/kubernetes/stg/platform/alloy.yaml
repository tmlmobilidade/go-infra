apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana-charts
  namespace: flux-system
spec:
  interval: 1h
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: kube-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: alloy
      version: "0.12.5"
      sourceRef:
        kind: HelmRepository
        name: grafana-charts
        namespace: flux-system
  values:
    # Ship STG cluster logs → Loki on Grafana VM (HTTPS via nginx /loki/)
    controller:
      type: deployment
      replicas: 1
    alloy:
      mounts:
        varlog: false
      configMap:
        create: true
        content: |-
          logging {
            level  = "info"
            format = "logfmt"
          }

          discovery.kubernetes "pods" {
            role = "pod"
          }

          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }

            # UI lists one entry per pod (not per Deployment/Service)
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "service_name"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "job"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }

            # Keep app label under k8s_app so Grafana won't group pods by Deployment name
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app"]
              target_label  = "k8s_app"
            }
          }

          loki.source.kubernetes "pods" {
            targets    = discovery.relabel.pods.output
            forward_to = [loki.process.pod_identity.receiver]
          }

          loki.process "pod_identity" {
            forward_to = [loki.write.default.receiver]

            // Re-assert after scrape so Grafana Logs UI keys off pod name
            stage.label_drop {
              values = ["app", "service", "app_kubernetes_io_name"]
            }
          }

          loki.write "default" {
            endpoint {
              url = "https://grafana.go.tmlmobilidade.pt/loki/api/v1/push"
            }
            external_labels = {
              cluster     = "go-stg",
              environment = "stg",
            }
          }
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
