# # #

name: Preview Environment

on:
  repository_dispatch:
    types: [preview-pr]

concurrency:
  group: pr-overlays-${{ github.event.client_payload.pr_number || 'all' }}
  cancel-in-progress: false

jobs:

  build-preview:
    if: github.event.client_payload.pr_action == 'build'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Create or update PR overlay for built apps
        env:
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          MODULE: ${{ github.event.client_payload.module }}
          APP: ${{ github.event.client_payload.app }}
          BUILT_APPS: ${{ github.event.client_payload.built_apps }}
        run: |
          set -euo pipefail

          PR_DIR="compute/kubernetes/stg/pr-overlays/pr-${PR_NUMBER}"
          STG_MODULES="compute/kubernetes/stg/modules"
          IS_NEW=false
          [[ ! -f "$PR_DIR/kustomization.yaml" ]] && IS_NEW=true
          mkdir -p "$PR_DIR"

          # Resolve apps to enable: built_apps list and/or module+app pair
          APPS_TO_ENABLE=""
          if [ -n "${BUILT_APPS:-}" ]; then
            APPS_TO_ENABLE=$(echo "${BUILT_APPS}" | tr ',' '\n' | sed '/^$/d')
          fi
          if [ -n "${MODULE:-}" ] && [ -n "${APP:-}" ]; then
            APPS_TO_ENABLE="${APPS_TO_ENABLE}"$'\n'"${MODULE}-${APP}"
          fi
          APPS_TO_ENABLE=$(echo "${APPS_TO_ENABLE}" | sed '/^$/d' | sort -u)
          if [ -z "${APPS_TO_ENABLE}" ]; then
            echo "build dispatch requires built_apps and/or module+app in payload"
            exit 1
          fi

          resolve_module_app() {
            local spec="$1"
            if [[ "$spec" == go-*-* ]]; then
              spec="${spec#go-}"
            fi
            if [[ "$spec" == *-* ]]; then
              MODULE="${spec%-*}"
              APP="${spec#*-}"
              # multi-word apps e.g. controller-rides-cleaner
              if [[ ! -f "${STG_MODULES}/${MODULE}/${APP}/helmrelease.yaml" ]]; then
                for MODULE_DIR in "$STG_MODULES"/*/; do
                  MOD=$(basename "$MODULE_DIR")
                  for APP_DIR in "$MODULE_DIR"/*/; do
                    A=$(basename "$APP_DIR")
                    if [ "${MOD}-${A}" = "$spec" ]; then
                      MODULE="$MOD"
                      APP="$A"
                      return 0
                    fi
                  done
                done
                echo "::warning::unknown app spec: ${spec} — skipping"
                return 1
              fi
              return 0
            fi
            echo "::warning::unknown app spec: ${spec} — skipping"
            return 1
          }

          ensure_namespace() {
            local module="$1"
            local ns="pr-${PR_NUMBER}-${module}"
            if [[ -f "$PR_DIR/namespaces.yaml" ]] && grep -q "name: ${ns}" "$PR_DIR/namespaces.yaml"; then
              return
            fi
            if [[ ! -f "$PR_DIR/namespaces.yaml" ]]; then
              cat > "$PR_DIR/namespaces.yaml" <<EOF
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ${ns}
            annotations:
              operator.1password.io/auto-restart: "true"
          EOF
            else
              cat >> "$PR_DIR/namespaces.yaml" <<EOF
          ---
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ${ns}
            annotations:
              operator.1password.io/auto-restart: "true"
          EOF
            fi
          }

          ensure_module_secrets() {
            local module="$1"
            local module_dir="${STG_MODULES}/${module}"

            if [[ -f "$module_dir/secrets.yaml" ]]; then
              out="$PR_DIR/${module}-secrets.yaml"
              if [[ ! -f "$out" ]]; then
                yq eval-all ".metadata.namespace = \"pr-${PR_NUMBER}-${module}\"" "$module_dir/secrets.yaml" > "$out"
              fi
            fi

            for secret_file in "$module_dir"/module-secrets.1passworditem.yaml "$module_dir"/platform-secrets.1passworditem.yaml; do
              [[ ! -f "$secret_file" ]] && continue
              basename=$(basename "$secret_file")
              out="$PR_DIR/${module}-${basename}"
              [[ -f "$out" ]] && continue
              yq eval-all ".metadata.namespace = \"pr-${PR_NUMBER}-${module}\"" "$secret_file" > "$out"
            done
          }

          enable_app() {
            local module="$1"
            local app="$2"
            local app_dir="${STG_MODULES}/${module}/${app}"
            if [[ ! -f "$app_dir/helmrelease.yaml" ]]; then
              echo "::warning::missing template ${module}/${app} — skipping"
              return 1
            fi

            ensure_namespace "$module"
            ensure_module_secrets "$module"

            echo "enable ${module}-${app}"
            yq eval '
              .metadata.name = "pr-'"${PR_NUMBER}"'-" + .spec.values.module + "-" + .spec.values.app |
              .spec.targetNamespace = "pr-'"${PR_NUMBER}"'-" + .spec.values.module |
              .spec.values.environment = "pr-'"${PR_NUMBER}"'" |
              .spec.values.ingress.host = "pr-'"${PR_NUMBER}"'.go-stg.tmlmobilidade.pt" |
              .spec.suspend = false |
              .spec.values.replicas = 1 |
              .spec.values.ingress.enabled = true
            ' "$app_dir/helmrelease.yaml" > "$PR_DIR/${module}-${app}.yaml"
          }

          while IFS= read -r spec; do
            [[ -z "$spec" ]] && continue
            if ! resolve_module_app "$spec"; then
              continue
            fi
            if ! enable_app "$MODULE" "$APP"; then
              continue
            fi
          done <<< "${APPS_TO_ENABLE}"

          # --- Kustomization for this PR directory ---
          {
            echo "apiVersion: kustomize.config.k8s.io/v1beta1"
            echo "kind: Kustomization"
            echo "resources:"
            echo "  - namespaces.yaml"
            for f in "$PR_DIR"/*.yaml; do
              BASENAME=$(basename "$f")
              [[ "$BASENAME" == "kustomization.yaml" || "$BASENAME" == "namespaces.yaml" ]] && continue
              echo "  - $BASENAME"
            done
          } > "$PR_DIR/kustomization.yaml"

          # --- Parent kustomization ---
          {
            echo "apiVersion: kustomize.config.k8s.io/v1beta1"
            echo "kind: Kustomization"
            echo "resources:"
            HAS_DIRS=false
            for d in compute/kubernetes/stg/pr-overlays/pr-*/; do
              [[ ! -d "$d" ]] && continue
              echo "  - $(basename "$d")"
              HAS_DIRS=true
            done
            if [ "$HAS_DIRS" = false ]; then echo "  []"; fi
          } > compute/kubernetes/stg/pr-overlays/kustomization.yaml

          if [ "$IS_NEW" = true ]; then
            echo "Created new overlay in $PR_DIR"
            echo "OVERLAY_ACTION=create" >> "$GITHUB_ENV"
          else
            echo "Updated overlay in $PR_DIR"
            echo "OVERLAY_ACTION=update" >> "$GITHUB_ENV"
          fi
          ls "$PR_DIR"

      - name: Commit and push
        env:
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          MODULE: ${{ github.event.client_payload.module }}
          APP: ${{ github.event.client_payload.app }}
          BUILT_APPS: ${{ github.event.client_payload.built_apps }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add compute/kubernetes/stg/pr-overlays/
          LABEL="${BUILT_APPS:-${MODULE}-${APP}}"
          ACTION="${OVERLAY_ACTION:-update}"
          git commit -m "chore: ${ACTION} preview for PR #${PR_NUMBER} (${LABEL})"
          git pull --rebase
          git push

  cleanup-preview:
    if: github.event.client_payload.pr_action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove PR overlay
        env:
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
        run: |
          set -euo pipefail

          PR_DIR="compute/kubernetes/stg/pr-overlays/pr-${PR_NUMBER}"
          if [ ! -d "$PR_DIR" ]; then
            echo "PR directory $PR_DIR does not exist, nothing to clean up"
            exit 0
          fi

          rm -rf "$PR_DIR"

          # Regenerate parent kustomization
          {
            echo "apiVersion: kustomize.config.k8s.io/v1beta1"
            echo "kind: Kustomization"
            echo "resources:"
            HAS_DIRS=false
            for d in compute/kubernetes/stg/pr-overlays/pr-*/; do
              [[ ! -d "$d" ]] && continue
              echo "  - $(basename "$d")"
              HAS_DIRS=true
            done
            if [ "$HAS_DIRS" = false ]; then echo "  []"; fi
          } > compute/kubernetes/stg/pr-overlays/kustomization.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add compute/kubernetes/stg/pr-overlays/
          git commit -m "chore: remove preview environment for PR #${PR_NUMBER}"
          git pull --rebase
          git push