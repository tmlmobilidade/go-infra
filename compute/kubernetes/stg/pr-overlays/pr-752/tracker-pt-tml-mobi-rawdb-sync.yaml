apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pr-752-tracker-mobi-rawdb-sync
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: pr-752-tracker
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/stg/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: pr-752
    module: tracker
    app: pt-tml-mobi-rawdb-sync
    replicas: 1
    service:
      targetPort: 5050
    ingress:
      enabled: true
      host: pr-752.go-stg.tmlmobilidade.pt
    secrets:
      - stg-platform-rawdb
      - stg-platform-godb
      - stg-platform-labdb
    logging:
      enabled: true
      cluster: go-stg
      loki:
        secretName: stg-platform-loki
    env: []
  suspend: false
