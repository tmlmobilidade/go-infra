apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pr-559-exporter-cleaner
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: pr-559-exporter
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: pr-559
    module: exporter
    app: cleaner
    replicas: 1
    service:
      targetPort: 5050
    ingress:
      enabled: true
      host: pr-559.go-stg.tmlmobilidade.pt
    secrets:
      - stg-module-exporter
      - stg-platform-godb
      - stg-platform-storage
    env: []
  suspend: false
