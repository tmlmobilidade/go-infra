apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hub-docs
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: stg-hub
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/stg/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: stg
    module: hub
    app: docs
    image: ghcr.io/tmlmobilidade/go-docs:production
    replicas: 1
    resources:
      memory: 2Gi
      cpu: 1
    service:
      targetPort: 3000
    ingress:
      enabled: true
      # /hub/reference → app /reference; /_next|/assets stay as-is (CSS/JS).
      path: /(hub/reference|_next|assets|api|lab|brand|files|map|icon\.png|manifest\.webmanifest)(/|$)(.*)
      pathType: ImplementationSpecific
      annotations:
        nginx.ingress.kubernetes.io/use-regex: "true"
        nginx.ingress.kubernetes.io/configuration-snippet: |
          rewrite ^/hub/reference/?$ /reference break;
          rewrite ^/hub/reference/(.*)$ /reference/$1 break;
    logging:
      enabled: true
      appArgs:
        - server.js
      cluster: go-stg
      loki:
        secretName: stg-platform-loki
    env:
      - name: PORT
        value: "3000"
