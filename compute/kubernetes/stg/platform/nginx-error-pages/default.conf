# Quiet static error backend for ingress-nginx custom-http-errors.
# Virtual Nodes: conf mounts as a whole dir (no subPath).
#
# ingress-nginx re-requests this backend with the *original* method (often POST).
# try_files only allows GET/HEAD → 405. Listen on 8080 and always fetch the
# HTML from :8081 with GET so clients see the real upstream status (e.g. 504).

server {
	listen 8080;
	server_tokens off;
	access_log off;
	error_log /dev/stderr error;

	location = /healthz {
		default_type text/plain;
		return 200 'ok';
	}

	location / {
		proxy_method GET;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header X-Code $http_x_code;
		proxy_pass http://127.0.0.1:8081;
	}
}

server {
	listen 8081;
	server_tokens off;
	access_log off;
	error_log /dev/stderr error;
	root /www;
	default_type text/html;

	location / {
		# return $var is not supported; use literal codes + X-Code header.
		# Force =CODE so try_files' 200 does not become the client status
		# (bare "= @error_body" was rewriting 503 → 200).
		error_page 404 =404 @error_body;
		error_page 500 =500 @error_body;
		error_page 501 =501 @error_body;
		error_page 502 =502 @error_body;
		error_page 503 =503 @error_body;
		error_page 504 =504 @error_body;
		if ($http_x_code = 500) { return 500; }
		if ($http_x_code = 501) { return 501; }
		if ($http_x_code = 502) { return 502; }
		if ($http_x_code = 503) { return 503; }
		if ($http_x_code = 504) { return 504; }
		return 404;
	}

	location @error_body {
		root /www;
		try_files /$status.html /404.html =404;
	}
}
