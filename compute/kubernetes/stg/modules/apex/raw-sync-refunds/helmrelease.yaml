apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: apex-raw-sync-refunds
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: stg-apex
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: stg
    module: apex
    app: raw-sync-refunds
    replicas: 1
    service:
      targetPort: 5050
    ingress:
      enabled: false
    secrets:
      - stg-module-apex
      - stg-platform-godb
      - stg-platform-pcgi-raw
      - stg-platform-clickhouse
      - stg-platform-sentry
    env: []