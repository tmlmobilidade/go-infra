apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: eta-cleaner
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: prd-eta
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: prd
    module: eta
    app: cleaner
    replicas: 1
    service:
      targetPort: 5050
    resources:
      memory: 3Gi
    ingress:
      enabled: false
    secrets:
      - prd-module-eta
      - prd-platform-sentry
    env: []
