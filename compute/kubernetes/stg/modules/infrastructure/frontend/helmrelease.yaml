apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: infrastructure-frontend
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: stg-infrastructure
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/stg/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: stg
    module: infrastructure
    app: frontend
    replicas: 1
    service:
      targetPort: 3000
    ingress:
      enabled: true
      # Prefix /infrastructure also matches /infrastructure/api, so nginx sends API POSTs to Next.js (405).
      # RE2 only — ingress-nginx rejects lookaheads and then keeps the old Prefix.
      path: "^/infrastructure(?:/(?:[^a].*|a(?:[^p].*|p(?:[^i].*|i(?:[^/].*))))?)?$"
      pathType: ImplementationSpecific
      annotations:
        nginx.ingress.kubernetes.io/use-regex: "true"
    probes:
      startup:
        enabled: true
        path: /infrastructure/health
    logging:
      enabled: true
      cluster: go-stg
      loki:
        secretName: stg-platform-loki
    env: []