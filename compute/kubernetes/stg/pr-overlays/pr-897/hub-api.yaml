apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pr-897-hub-api
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: pr-897-hub
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/stg/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: pr-897
    module: hub
    app: api
    replicas: 1
    resources:
      memory: 4Gi
      cpu: 2
    service:
      targetPort: 5050
    ingress:
      enabled: true
      path: /hub/api(/|$)(.*)
      pathType: ImplementationSpecific
      annotations:
        nginx.ingress.kubernetes.io/use-regex: "true"
        nginx.ingress.kubernetes.io/rewrite-target: /$2
      host: pr-897.go-stg.tmlmobilidade.pt
    secrets:
      - stg-platform-godb
      - stg-platform-cachedb
      - stg-platform-storage
      - stg-platform-labdb
    probes:
      startup:
        enabled: true
    logging:
      enabled: true
      cluster: go-stg
      loki:
        secretName: stg-platform-loki
    env: []
  suspend: false
