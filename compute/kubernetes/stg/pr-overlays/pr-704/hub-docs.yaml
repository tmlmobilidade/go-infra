apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pr-704-hub-docs
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: pr-704-hub
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/stg/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: pr-704
    module: hub
    app: docs
    image: ghcr.io/tmlmobilidade/go-docs:production
    replicas: 1
    resources:
      memory: 4Gi
      cpu: 2
    service:
      targetPort: 3000
    ingress:
      enabled: true
      path: /reference
      pathType: Prefix
      host: pr-704.go-stg.tmlmobilidade.pt
    probes:
      startup:
        enabled: false
    # go-docs is Next.js — chart log-wrap assumes go-app node entrypoints.
    logging:
      enabled: false
    env:
      - name: PORT
        value: "3000"
  suspend: false
