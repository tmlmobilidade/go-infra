apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ingress-nginx
resources:
  - static-server.yaml
configMapGenerator:
  - name: ingress-nginx-error-pages
    files:
      - not-found.html
      - error.html
      - maintenance.html
generatorOptions:
  disableNameSuffixHash: true
