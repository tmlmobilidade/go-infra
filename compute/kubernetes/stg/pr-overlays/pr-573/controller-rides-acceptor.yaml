apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pr-573-controller-rides-acceptor
  namespace: flux-system
spec:
  interval: 5m
  dependsOn:
    - name: onepassword-connect
  targetNamespace: pr-573-controller
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    module: controller
    replicas: 1
    service:
      targetPort: 5050
    ingress:
      enabled: true
      host: pr-573.go-stg.tmlmobilidade.pt
    secrets:
      - stg-module-controller
      - stg-platform-sentry-controller
    env: []
    environment: pr-573
    app: rides-acceptor
  suspend: false
