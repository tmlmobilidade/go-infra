apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pr-940-apex-raw-sync-locations
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: pr-940-apex
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/stg/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: pr-940
    module: apex
    app: raw-sync-locations
    replicas: 1
    service:
      targetPort: 5050
    ingress:
      enabled: true
      host: pr-940.go-stg.tmlmobilidade.pt
    secrets:
      - stg-platform-godb
      - stg-platform-rawdb
      - stg-platform-labdb
    logging:
      enabled: true
      cluster: go-stg
      loki:
        secretName: stg-platform-loki
    env: []
  suspend: false
