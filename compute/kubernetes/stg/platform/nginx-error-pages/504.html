<!DOCTYPE html>
<html lang="pt">
<head>
	<meta charset="UTF-8">
	<title>GO | Erro Inesperado</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Jersey+25&display=swap" rel="stylesheet">
</head>

<body>

	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
			color: white;
			text-decoration: none;
			letter-spacing: 0.5px;
			font-family: "Work Sans", sans-serif;
		}
		body {
			font-style: normal;
			line-height: 1.8;
			background-color: rgb(45, 15, 115);
		}
		.container {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 30px;
			text-align: center;
			height: 100vh;
			width: 100%;
			max-width: 500px;
			margin: auto;
		}
		.title {
			font-family: "Jersey 25", sans-serif;
			font-weight: 400;
			font-size: 70px;
			line-height: 1;
			letter-spacing: 0;
			text-transform: uppercase;
			opacity: 0.5;
		}
		.text {
			font-weight: 500;
			font-size: 18px;
		}
		.status-link {
			text-transform: uppercase;
			font-weight: 600;
			font-size: 14px;
			opacity: 0.5;
		}
		.status-link:hover {
			text-decoration: underline;
			opacity: 0.75;
		}
		.retry {
			font-weight: 600;
			font-size: 20px;
			opacity: 0;
			transition: opacity 0.3s ease;
		}
	</style>

	<div class="container">
		<h1 class="title">Erro</h1>
		<p class="text">Um componente ficou indisponível e tem que ser manualmente iniciado. A equipa está a ser notificada neste exato momento para corrigir a situação.</p>
		<p class="text" style="font-size:14px;text-transform: uppercase;">Tentativas até agora: <span id="counter">0</span></p>
		<a id="link" class="status-link" href="https://status.carrismetropolitana.pt/status/go" target="_blank" rel="noopener noreferrer">Ver Estado</a>
		<p id="retry" class="retry">A tentar novamente...</p>
	</div>

	<script>

		/**
		 * Increases the notification counter
		 * displayed on the page.
		 */
		function increaseCounter() {
			const counterElem = document.getElementById("counter");
			let counterValue = parseInt(counterElem.innerText);
			counterElem.innerText = counterValue + 1;
		}

		/**
		 * Retries the page the user was trying to open.
		 */
		function ping() {
			fetch(window.location.href, { cache: "no-store", redirect: "manual" })
				.then((res) => {
					increaseCounter();
					if (res.ok) window.location.reload();
				})
				.catch(err => console.error("Request failed:", err));
		}

		/**
		 * Reloads the page after a timeout
		 * to try again.
		 */
		function reloadPage() {
			document.getElementById("retry").style.opacity = 1;
			setTimeout(() => window.location.reload(), 3_000);
		}

		//
		// Retry the requested page immediately
		// and then every 15 seconds.

		ping();
		setInterval(ping, 15_000);

		//
		// After 15 seconds elapsed,
		// reload the page to try again.

		setTimeout(reloadPage, 15_000);

	</script>

</body>
</html>
