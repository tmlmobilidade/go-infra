apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-tls-stg
  namespace: flux-system
spec:
  interval: 1m
  dependsOn:
    - name: platform-stg
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./compute/kubernetes/stg/platform/cert-tls
  prune: true
  wait: true
  timeout: 10m
  healthChecks:
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      name: go-stg-tls
      namespace: cert-manager
