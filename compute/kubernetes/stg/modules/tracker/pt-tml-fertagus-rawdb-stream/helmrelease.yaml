apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tracker-pt-tml-fertagus-rawdb-stream
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: stg-tracker
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: stg
    module: tracker
    app: pt-tml-fertagus-rawdb-stream
    replicas: 1
    service:
      targetPort: 5050
    ingress:
      enabled: false
    secrets:
      - stg-module-tracker
      - stg-platform-rawdb
      - stg-platform-labdb
    env: []
