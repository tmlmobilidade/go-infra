name: valhalla

environment: stg

image:
  repository: ghcr.io/valhalla/valhalla-scripted
  tag: latest
  pullPolicy: IfNotPresent

pbfUrl: https://download.geofabrik.de/europe/portugal-latest.osm.pbf

replicas: 1

persistence:
  create: true
  claimName: valhalla-pvc
  mountPath: /custom_files
  size: 50Gi
  accessMode: ReadWriteOnce
  storageClassName: ""

resources:
  requests:
    cpu: "2000m"
    memory: "4Gi"
  limits:
    cpu: "4000m"
    memory: "8Gi"

service:
  port: 80
  targetPort: 8002

ingress:
  enabled: false
  path: /locations/valhalla(/|$)(.*)
  pathType: ImplementationSpecific
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2

# Daily Portugal OSM refresh (same flow as VM update-portugal-osm.sh).
updateCron:
  enabled: false
  schedule: "0 4 * * *"
  timeZone: Europe/Lisbon
  image: bitnami/kubectl:1.31.4
  mountPath: /custom_files
  pbfFileName: portugal-latest.osm.pbf
  pvcClaimName: valhalla-pvc
