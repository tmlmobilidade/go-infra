apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: offer-organizer
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: prd-offer
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/prd/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: prd
    module: offer
    app: organizer
    replicas: 1
    resources:
      memory: 3Gi
    ingress:
      enabled: false
    secrets:
      - prd-platform-godb
    logging:
      enabled: true
      cluster: go-prd
      loki:
        secretName: prd-platform-loki
    env: []