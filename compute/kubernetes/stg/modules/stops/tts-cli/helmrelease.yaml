apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stops-tts-cli
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: stg-stops
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: stg
    module: stops
    app: tts-cli
    replicas: 1
    service:
      targetPort: 8000
    ingress:
      enabled: false
    secrets:
      - stg-platform-storage
      - stg-platform-sentry-stops
      - stg-platform-go-cache-db
    env: []
