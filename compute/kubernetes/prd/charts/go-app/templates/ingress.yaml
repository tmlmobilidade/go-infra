{{- /* Minion: NIC merges paths only with a Master for the same host. */ -}}
{{- if and .Values.ingress.enabled .Values.ingress.path }}
{{- $host := .Values.ingress.host | default "go.tmlmobilidade.pt" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ .Values.environment }}-{{ .Values.module }}-{{ .Values.app }}"
  namespace: "{{ .Values.environment }}-{{ .Values.module }}"
  labels:
    environment: {{ .Values.environment }}
    module: {{ .Values.module }}
    app: {{ .Values.app }}
  annotations:
    nginx.org/mergeable-ingress-type: "minion"
    nginx.org/client-max-body-size: "1g"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path | quote }}
            pathType: {{ .Values.ingress.pathType | default "Prefix" }}
            backend:
              service:
                name: "{{ .Values.environment }}-{{ .Values.module }}-{{ .Values.app }}"
                port:
                  number: 80
{{- end }}
