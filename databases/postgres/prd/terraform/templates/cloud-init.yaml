#cloud-config

# -----------------------------------------------------------------------
# cloud-init.yaml — postgres Node (node_index = ${node_index})
#
# Docker and OS tuning are pre-baked into the Packer image.
# This file handles runtime concerns only:
#   - Attaches and mounts the block volume
#   - Configures firewall and Postgres data directory permissions
#   - Writes runtime secrets and starts Postgres container
#
# Note: compose ports are hardcoded in packer/init/compose.yaml.
# -----------------------------------------------------------------------

packages:
  - xfsprogs

runcmd:

  # 1.
  # Attach and mount the block volume
  # using the script pre-packed by Packer

  - /opt/app/attach-volume.sh
  - rm /opt/app/attach-volume.sh

  # 2.
  # Configure firewall to allow Postgres traffic
  # using the script pre-packed by Packer

  - /opt/app/firewall.sh
  - rm /opt/app/firewall.sh

  # 3.
  # Setup Postgres data directory permissions
  # using the script pre-packed by Packer

  - /opt/app/setup-postgres.sh
  - rm /opt/app/setup-postgres.sh

  # 4.
  # Write runtime secrets

  - |
    mkdir -p /opt/app/secrets
    cat > /opt/app/secrets/.env <<ENVEOF
    POSTGRES_PASSWORD=${postgres_admin_password}
    POSTGRES_USER=admin
    POSTGRES_DB=production
    ENVEOF
    chmod 600 /opt/app/secrets/.env

  # 5.
  # Start Postgres

  - cd /opt/app && docker compose up -d --build --force-recreate --remove-orphans --pull=always

final_message: "Postgres node ${node_index + 1} of ${length(all_private_ips)} configuration complete."
