apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pr-477-stops-tts
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: pr-477-stops
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: pr-477
    module: stops
    app: tts
    replicas: 1
    service:
      targetPort: 8000
    resources:
      memory: 6Gi
    ingress:
      enabled: true
      host: pr-477.go-stg.tmlmobilidade.pt
    secrets:
      - stg-platform-storage
    env: []
  suspend: false
