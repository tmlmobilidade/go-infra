# Official ingress-nginx custom-error-pages backend.
# Serves /www/{code}.html and returns X-Code status (required by custom-http-errors).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: error-pages
  namespace: ingress-nginx
  labels:
    app: error-pages
spec:
  replicas: 1
  selector:
    matchLabels:
      app: error-pages
  template:
    metadata:
      labels:
        app: error-pages
    spec:
      containers:
        - name: custom-error-pages
          image: registry.k8s.io/ingress-nginx/custom-error-pages:v1.12.1
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: pages
              mountPath: /www
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: pages
          configMap:
            name: ingress-nginx-error-pages
---
apiVersion: v1
kind: Service
metadata:
  name: error-pages
  namespace: ingress-nginx
  labels:
    app: error-pages
spec:
  selector:
    app: error-pages
  ports:
    - name: http
      port: 80
      targetPort: http
