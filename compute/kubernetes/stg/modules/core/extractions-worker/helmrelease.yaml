apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: core-extractions-worker
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: stg-core
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: stg
    module: core
    app: extractions-worker
    replicas: 1
    deployment:
      strategy:
        type: Recreate
    resources:
      memory: 8Gi
      cpu: 4000m
    ingress:
      enabled: false
    secrets:
      - stg-platform-godb
      - stg-platform-labdb
      - stg-platform-storage
      - stg-platform-sentry
    logging:
      enabled: true
      cluster: go-stg
      loki:
        secretName: stg-platform-loki
    env: []