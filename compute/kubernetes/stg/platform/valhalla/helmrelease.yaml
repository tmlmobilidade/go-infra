apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valhalla
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: stg-valhalla
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: compute/kubernetes/charts/valhalla
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    name: valhalla
    environment: stg
    replicaCount: 1
    image:
      repository: ghcr.io/valhalla/valhalla-scripted
      tag: latest
    pbfUrl: https://download.geofabrik.de/europe/portugal-latest.osm.pbf
    pbfFileName: portugal-latest.osm.pbf
    initDownload:
      enabled: true
      image: curlimages/curl:8.12.1
    persistence:
      enabled: true
      mountPath: /custom_files
      size: 50Gi
      accessMode: ReadWriteMany
      storageClass: fss-dyn-storage
    ingress:
      enabled: true
      path: /valhalla(/|$)(.*)
      pathType: ImplementationSpecific
      annotations:
        nginx.ingress.kubernetes.io/use-regex: "true"
        nginx.ingress.kubernetes.io/rewrite-target: /$2
    updateCron:
      enabled: true
      schedule: "0 4 * * *"
      timeZone: Europe/Lisbon
      image: bitnami/kubectl:1.31.4
      deploymentName: valhalla
    resources:
      requests:
        cpu: "2000m"
        memory: "4Gi"
      limits:
        cpu: "2000m"
        memory: "4Gi"

