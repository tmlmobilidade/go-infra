apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pr-517-alerts-organizer
  namespace: flux-system
spec:
  interval: 5m
  dependsOn:
    - name: onepassword-connect
  targetNamespace: pr-517-alerts
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: pr-517
    app: organizer
    module: alerts
    replicas: 1
    service:
      targetPort: 5050
    ingress:
      enabled: false
      host: pr-517.go-stg.tmlmobilidade.pt
    secrets:
      - stg-platform-storage
    env: []
