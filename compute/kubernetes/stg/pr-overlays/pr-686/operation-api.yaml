apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pr-686-operation-api
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: pr-686-operation
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/stg/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: pr-686
    module: operation
    app: api
    replicas: 1
    service:
      targetPort: 5050
    resources:
      memory: 6Gi
      cpu: 4000m
    ingress:
      enabled: true
      path: /operation/api(/|$)(.*)
      pathType: ImplementationSpecific
      annotations:
        nginx.ingress.kubernetes.io/use-regex: "true"
        nginx.ingress.kubernetes.io/rewrite-target: /$2
      host: pr-686.go-stg.tmlmobilidade.pt
    secrets:
      - stg-platform-godb
      - stg-platform-labdb
      - stg-platform-storage
      - stg-platform-ai
      - stg-platform-email
    probes:
      startup:
        enabled: true
    logging:
      enabled: true
      cluster: go-stg
      loki:
        secretName: stg-platform-loki
    env: []
  suspend: false
