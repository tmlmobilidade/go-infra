{{- if .Values.logging.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Values.environment }}-{{ .Values.module }}-{{ .Values.app }}-logging"
  namespace: "{{ .Values.environment }}-{{ .Values.module }}"
  labels:
    environment: {{ .Values.environment }}
    module: {{ .Values.module }}
    app: {{ .Values.app }}
data:
  # Distroless node images have no shell — wrap stdout/stderr to a shared emptyDir
  # so Alloy can tail files (OKE Virtual Nodes: pods/log API is unreliable).
  wrap.cjs: |
    const { spawn } = require("child_process");
    const fs = require("fs");

    const logDir = process.env.LOG_DIR || "/var/log/app";
    const logFile = `${logDir}/stdout.log`;
    fs.mkdirSync(logDir, { recursive: true });
    const out = fs.createWriteStream(logFile, { flags: "a" });

    const args = process.argv.slice(2);
    if (args.length === 0) {
      console.error("log-wrap: missing app args");
      process.exit(1);
    }

    const child = spawn(process.execPath, args, {
      stdio: ["inherit", "pipe", "pipe"],
    });

    const pipe = (stream, dest) => {
      stream.on("data", (chunk) => {
        dest.write(chunk);
        out.write(chunk);
      });
    };
    pipe(child.stdout, process.stdout);
    pipe(child.stderr, process.stderr);

    const shutdown = (code, signal) => {
      out.end();
      if (signal) {
        process.kill(process.pid, signal);
        return;
      }
      process.exit(code ?? 1);
    };
    child.on("error", (err) => {
      console.error("log-wrap:", err);
      shutdown(1);
    });
    child.on("exit", shutdown);

  config.alloy: |
    logging {
      level  = "warn"
      format = "logfmt"
    }

    local.file_match "app" {
      path_targets = [{
        __path__ = {{ printf "%s/*.log" .Values.logging.logPath | quote }},
      }]
    }

    loki.source.file "app" {
      targets    = local.file_match.app.targets
      forward_to = [loki.process.labels.receiver]
    }

    loki.process "labels" {
      forward_to = [loki.write.default.receiver]

      stage.static_labels {
        values = {
          namespace    = env("POD_NAMESPACE"),
          pod          = env("POD_NAME"),
          service_name = env("POD_NAME"),
          container    = {{ printf "%s-%s-%s" .Values.environment .Values.module .Values.app | quote }},
          workload     = {{ printf "%s-%s-%s" .Values.environment .Values.module .Values.app | quote }},
        }
      }
    }

    loki.write "default" {
      endpoint {
        url = {{ .Values.logging.loki.url | quote }}
        basic_auth {
          username = env("LOKI_USERNAME")
          password = env("LOKI_PASSWORD")
        }
      }
      external_labels = {
        cluster     = {{ .Values.logging.cluster | quote }},
        environment = {{ .Values.environment | quote }},
        module      = {{ .Values.module | quote }},
        app         = {{ .Values.app | quote }},
      }
    }
{{- end }}
