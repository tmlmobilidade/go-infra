# PRD: F5 NGINX Ingress Controller (replaces deprecated kubernetes/ingress-nginx).
# Chart: nginx-ingress from oci://ghcr.io/nginx/charts
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nginx-ingress-charts
  namespace: flux-system
spec:
  interval: 1h
  type: oci
  url: oci://ghcr.io/nginx/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx-ingress
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: ingress-nginx
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: nginx-ingress
      version: "2.9.1"
      sourceRef:
        kind: HelmRepository
        name: nginx-ingress-charts
        namespace: flux-system
      interval: 1h
  values:
    controller:
      replicaCount: 4
      enableSnippets: true
      # Every ingress for the cluster flows through this controller.
      # Requests match limits (OKE Virtual Nodes).
      resources:
        requests:
          cpu: "2000m"
          memory: "2Gi"
        limits:
          cpu: "2000m"
          memory: "2Gi"
      # Public OCI Network Load Balancer (internet-facing), same pattern as STG.
      # Virtual Nodes: Pods as Backends (targetPort 80/443), not NodePort.
      service:
        type: LoadBalancer
        allocateLoadBalancerNodePorts: false
        externalTrafficPolicy: Cluster
        annotations:
          oci.oraclecloud.com/load-balancer-type: "nlb"
          oci-network-load-balancer.oraclecloud.com/internal: "false"
          oci-network-load-balancer.oraclecloud.com/assigned-private-ipv4: "10.81.101.2"
          oci-network-load-balancer.oraclecloud.com/subnet: "ocid1.subnet.oc1.eu-frankfurt-1.aaaaaaaap4iuqtem64qsbejvu73u7ssm5n3eaa7ggds76zsokytka24q5pna"
          oci-network-load-balancer.oraclecloud.com/health-check: '{"protocol":"TCP","retries":3,"timeoutInMillis":3000,"intervalInMillis":10000}'
      # TLS for hosts without their own secret (was --default-ssl-certificate).
      wildcardTLS:
        secret: ingress-nginx/go-prd-tls
      ingressClass:
        name: nginx
        create: true
        setAsDefaultIngress: true
      config:
        entries:
          server-tokens: "false"
          http2: "true"
          ssl-redirect: "true"
          client-max-body-size: "2g"
          proxy-connect-timeout: "10s"
          proxy-send-timeout: "30s"
          proxy-read-timeout: "30s"
          keepalive-timeout: "65s"
          keepalive: "16"
          proxy-buffering: "true"
          location-snippets: |
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
          http-snippets: |
            # Frontend documents and Next.js navigation must follow the current deployment.
            map $http_accept $go_frontend_request {
              default 0;
              ~*text/(?:html|x-component) 1;
            }
            map $upstream_http_content_type $go_frontend_response {
              default 0;
              "~*^text/(?:html|x-component)(?:;|$)" 1;
            }
            # Cache zone (gateway-style): only used when upstream sends Cache-Control/Expires.
            proxy_cache_path /tmp/nginx-cache
              levels=1:2
              keys_zone=go_cache:10m
              max_size=1g
              inactive=1h
              use_temp_path=off;
            upstream docs_upstream {
              least_conn;
              server prd-docs.prd-docs.svc.cluster.local:80 max_fails=3 fail_timeout=5s;
              keepalive 10;
            }
          server-snippets: |
            # Honor upstream cache headers, except for frontend HTML and navigation.
            proxy_cache go_cache;
            # Retire entries written before HTML and navigation were excluded.
            proxy_cache_key "v2:$scheme$request_method$host$request_uri";
            proxy_cache_lock on;
            proxy_cache_lock_timeout 30s;
            proxy_cache_lock_age 30s;
            proxy_cache_bypass $http_authorization $cookie_session_token $http_upgrade $http_rsc $go_frontend_request;
            proxy_no_cache $http_authorization $cookie_session_token $http_upgrade $http_rsc $go_frontend_request $go_frontend_response;
            add_header Go-Cache-Status $upstream_cache_status always;
            # Custom error pages (replaces community defaultBackend / custom-http-errors).
            proxy_intercept_errors on;
            error_page 404 500 501 502 503 504 = @go_error_pages;
            location @go_error_pages {
              internal;
              proxy_intercept_errors off;
              proxy_method GET;
              proxy_http_version 1.1;
              proxy_set_header Connection "";
              proxy_set_header X-Code $status;
              # Named locations cannot use proxy_pass with a URI part — rewrite then pass host only.
              rewrite ^ / break;
              proxy_pass http://error-pages.ingress-nginx.svc.cluster.local:8080;
            }
            location ^~ /hub/api/v1/plans/gtfs/cm {
              rewrite ^/hub/api/v1/plans/gtfs/cm(.*)$ /hub/api/v1/LA3SO/plans/gtfs$1 permanent;
            }
            location = / {
              proxy_http_version 1.1;
              proxy_set_header Connection "";
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_pass http://docs_upstream;
            }
            location ^~ /_next/ {
              proxy_http_version 1.1;
              proxy_set_header Connection "";
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_pass http://docs_upstream;
            }
            location ^~ /assets/ {
              proxy_http_version 1.1;
              proxy_set_header Connection "";
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_pass http://docs_upstream;
            }
            location ^~ /api/ {
              proxy_http_version 1.1;
              proxy_set_header Connection "";
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_pass http://docs_upstream;
            }
            location ^~ /reference {
              proxy_http_version 1.1;
              proxy_set_header Connection "";
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_pass http://docs_upstream;
            }
            location ^~ /lab/ {
              proxy_http_version 1.1;
              proxy_set_header Connection "";
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_pass http://docs_upstream;
            }
            location ^~ /brand/ {
              proxy_http_version 1.1;
              proxy_set_header Connection "";
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_pass http://docs_upstream;
            }
            location ^~ /files/ {
              proxy_http_version 1.1;
              proxy_set_header Connection "";
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_pass http://docs_upstream;
            }
            location ^~ /map/ {
              proxy_http_version 1.1;
              proxy_set_header Connection "";
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_pass http://docs_upstream;
            }
            location = /icon.png {
              proxy_http_version 1.1;
              proxy_set_header Connection "";
              proxy_set_header Host $host;
              proxy_pass http://docs_upstream;
            }
            location = /manifest.webmanifest {
              proxy_http_version 1.1;
              proxy_set_header Connection "";
              proxy_set_header Host $host;
              proxy_pass http://docs_upstream;
            }
