apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tracker-pt-tml-cm-core-migrate
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: stg-tracker
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: stg
    module: tracker
    app: pt-tml-cm-core-migrate
    replicas: 75
    deployment:
      strategy:
        type: Recreate
    service:
      targetPort: 5050
    ingress:
      enabled: false
    secrets:
      - stg-platform-rawdb
      - stg-platform-sentry
    logging:
      enabled: true
      cluster: go-stg
      loki:
        secretName: stg-platform-loki
    env: []