apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pr-633-stops-tts-server
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: pr-633-stops
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: pr-633
    module: stops
    app: tts-server
    replicas: 1
    service:
      targetPort: 8000
    ingress:
      enabled: true
      host: pr-633.go-stg.tmlmobilidade.pt
    env: []
  suspend: false
