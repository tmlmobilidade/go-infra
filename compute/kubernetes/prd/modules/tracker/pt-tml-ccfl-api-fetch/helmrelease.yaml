apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tracker-pt-tml-ccfl-api-fetch
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: prd-tracker
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: stg
    module: tracker
    app: pt-tml-ccfl-api-fetch
    replicas: 1
    service:
      targetPort: 5050
    ingress:
      enabled: false
    secrets:
      - prd-module-tracker
      - prd-platform-rawdb
      - prd-platform-external-app-secrets
      - prd-platform-sentry
    env: []