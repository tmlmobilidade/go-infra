name: valhalla

pbfUrl: https://download.geofabrik.de/europe/portugal-latest.osm.pbf

minReplicas: 1
maxReplicas: 2

persistence:
  storage: 20Gi
  storageClassName: ""
  accessMode: ReadWriteMany

resources:
  requests:
    cpu: "2000m"
    memory: "4Gi"
  limits:
    cpu: "4000m"
    memory: "8Gi"

service:
  type: ClusterIP
  annotations: {}
