apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pr-559-apex-pcgi-stream
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: pr-559-apex
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: pr-559
    module: apex
    app: pcgi-stream
    replicas: 1
    service:
      targetPort: 5050
    ingress:
      enabled: true
      host: pr-559.go-stg.tmlmobilidade.pt
    secrets:
      - stg-platform-pcgi-file-manager
      - stg-platform-pcgi-tunnel
      - stg-platform-rawdb
    env: []
  suspend: false
