# One Master for go.tmlmobilidade.pt. Path Ingresses (go-app) are Minions.
# Do NOT set nginx.org/server-snippets here — it overrides ConfigMap server-snippets
# (docs locations, error pages, cache) for this host. IP catch-all lives in
# ingress-nginx ConfigMap server-snippets instead.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: host-prd
  namespace: ingress-nginx
  annotations:
    nginx.org/mergeable-ingress-type: "master"
    nginx.org/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [go.tmlmobilidade.pt]
  rules:
    - host: go.tmlmobilidade.pt
