apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: core-frontend
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
  - name: onepassword-connect
  targetNamespace: stg-core
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: stg
    module: core
    app: frontend
    replicas: 1
    service:
      targetPort: 3000
    ingress:
      enabled: true
      path: /core
      pathType: Prefix
    secrets:
      - stg-module-core
    env: []