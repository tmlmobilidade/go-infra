apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pr-847-performance-sync-metrics-hourly
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: pr-847-performance
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/stg/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: pr-847
    module: performance
    app: sync-metrics-hourly
    replicas: 1
    resources:
      memory: 2Gi
    service:
      targetPort: 5050
    ingress:
      enabled: true
      host: pr-847.go-stg.tmlmobilidade.pt
    secrets:
      - stg-module-performance
      - stg-platform-godb
      - stg-platform-labdb
    logging:
      enabled: true
      cluster: go-stg
      loki:
        secretName: stg-platform-loki
    env: []
  suspend: false
