apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pr-559-eta-loader
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: onepassword-connect
  targetNamespace: pr-559-eta
  install:
    createNamespace: true
  chart:
    spec:
      chart: compute/kubernetes/charts/go-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    environment: pr-559
    module: eta
    app: loader
    replicas: 1
    service:
      targetPort: 5050
    resources:
      memory: 6Gi
      cpu: 4000m
    ingress:
      enabled: true
      host: pr-559.go-stg.tmlmobilidade.pt
    secrets:
      - stg-module-eta
      - stg-platform-godb
      - stg-platform-labdb
    env: []
  suspend: false
